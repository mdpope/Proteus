<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:"><title>Downloads</title><style>
:root{color-scheme:dark;--background:#223129;--text:#e7eee5;--muted:#a5b1a3;--border:#3b4b3e;--hover:#2d4033;--accent:#c6e49e;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:var(--text);background:var(--background)}*{box-sizing:border-box}body{margin:0;border:1px solid var(--border);min-height:100vh;padding:8px 12px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;height:42px}h1{font-size:14px;margin:0;font-weight:600}button{font:inherit;color:inherit;background:none;border:0;border-radius:5px;padding:8px;cursor:pointer}button:hover,button:focus-visible{background:var(--hover)}button:focus-visible{outline:2px solid var(--accent)}button:disabled{opacity:.5;cursor:default}button.icon{width:32px;height:32px;display:grid;place-items:center;flex-shrink:0}svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}#list{max-height:444px;overflow:auto}.row{display:flex;align-items:center;gap:12px;min-height:76px;padding:10px 0;border-top:1px solid var(--border)}.file-icon{position:relative;width:32px;flex-shrink:0;color:var(--accent)}.file-icon svg{width:30px;height:34px}.file-icon img{width:30px;height:30px;object-fit:contain}.type{position:absolute;bottom:3px;left:2px;font-size:9px;font-weight:600;background:var(--background);padding:0 2px}.detail{min-width:0;flex:1}.filename{display:block;text-align:left;font-weight:500;overflow-wrap:anywhere;width:100%;padding:0}.filename:hover{background:none;color:var(--accent)}.status{color:var(--muted);font-size:12px;margin-top:3px}progress::-webkit-progress-bar{background:var(--track,#364639)}progress::-webkit-progress-value{background:var(--accent)}progress{appearance:none;border:0;width:100%;height:4px;display:block;margin-top:7px;accent-color:var(--accent)}.actions{display:flex;gap:3px}.empty{color:var(--muted);padding:8px 0}#error{color:var(--text);margin:0}#error:empty{display:none}</style></head><body><header><h1>Downloads</h1><button class="icon" id="folder" aria-label="Open Downloads folder" title="Open Downloads folder"></button></header><p id="error" role="alert"></p><div id="list"></div><script src="browser-download-panel.js"></script></body></html>
