<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'"><title>Browser page menu</title><style>
:root{color-scheme:dark;--background:#223129;--text:#e5e7e2;--border:#46594b;--hover:#2d382f;--accent:#c4d99a}*{box-sizing:border-box}body{margin:0;padding:8px;background:var(--background);color:var(--text);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;border:1px solid var(--border);border-radius:8px;height:100vh;overflow:auto}button{font:inherit;color:inherit;background:transparent;border:0;border-radius:4px;cursor:default}button:hover:not(:disabled){background:var(--hover)}button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}button:disabled{opacity:.4}.scale{display:flex;align-items:center;gap:4px;height:50px;padding:4px 4px 10px;border-bottom:1px solid var(--border);margin-bottom:8px}.scale[hidden]{display:none}.scale>span{flex:1}.scale button{height:32px;min-width:32px;border:1px solid var(--border)}#percent{min-width:62px;font-variant-numeric:tabular-nums}#choices{display:flex;flex-direction:column}#choices button{display:flex;align-items:center;gap:8px;height:32px;flex-shrink:0;text-align:left;padding:0 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-icon{width:15px;height:15px;flex:0 0 15px;object-fit:contain}.menu-label{overflow:hidden;text-overflow:ellipsis}
</style></head><body><div class="scale" role="group" aria-label="Page scale"><span>Page scale</span><button id="decrease" aria-label="Decrease page scale">−</button><button id="percent" aria-label="Reset page scale to 100%" title="Reset to 100%">100%</button><button id="increase" aria-label="Increase page scale">+</button></div><div id="choices" role="menu" aria-label="Page actions"></div><script type="module" src="browser-page-menu.js"></script></body></html>
