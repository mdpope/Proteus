function tabsPage(){let tabs=allTabs().filter(t=>s.screen==='workspace'?pr(t.p)?.w===s.w:t.p===s.p);if(s.screen==='workspace'&&s.projectFilter&&pr(s.projectFilter)?.w===s.w)tabs=tabs.filter(t=>t.p===s.projectFilter);if(s.typeFilter)tabs=tabs.filter(t=>t.type===s.typeFilter);if(s.tabFilter==='hidden')tabs=tabs.filter(t=>t.hidden);if(s.tabFilter==='unloaded')tabs=tabs.filter(t=>t.type==='browser'&&!t.loaded);return heading(s.screen==='workspace'?'All workspace tabs':'Project tabs',`${tabs.length} tabs · hidden and unloaded included`,btn('+ Add tabs','add-tab','','primary'))+`<div class="row">${s.screen==='workspace'?`<label class="small">Project<select data-project-filter><option value="">All locations</option><option value="workspace:${s.w}" ${s.projectFilter==='workspace:'+s.w?'selected':''}>Workspace tabs</option>${projects.filter(p=>p.w===s.w).map(p=>`<option value="${p.id}" ${s.projectFilter===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>`:''}<label class="small">Type<select data-type-filter>${[['','All types'],['chat','Chats'],['browser','Browsers'],['terminal','Terminals'],['document','Documents']].map(([v,l])=>`<option value="${v}" ${s.typeFilter===v?'selected':''}>${l}</option>`).join('')}</select></label><label class="small">Show <select data-tab-filter aria-label="Tab visibility filter"><option value="all" ${s.tabFilter==='all'?'selected':''}>All tabs</option><option value="hidden" ${s.tabFilter==='hidden'?'selected':''}>Hidden</option><option value="unloaded" ${s.tabFilter==='unloaded'?'selected':''}>Unloaded</option></select></label>${s.detached.filter(t=>pr(t.p)?.w===s.w).map(t=>btn('Reattach '+esc(t.title),'reattach',t.id,'plain')).join('')}${s.screen==='workspace'?btn('Unload browsers','bulk-unload','','plain')+btn('Close tabs…','bulk-close','','plain'):''}</div>`+tabs.map(t=>`<div class="tablist-row">${icon(typeIcon(t.type))}<div>${btn(esc(t.title),'open-tab',t.id,'rowtitle')}<div class="path muted">${esc(t.url||'Conversation')}</div><div class="row small muted">${btn(esc(pname(t.p)),'project',t.p,'plain')}${t.type==='browser'?pill(t.loaded?'Loaded':'Unloaded',t.loaded?'':'good'):pill(t.type)}${t.hidden?pill('Hidden'):pill('Visible')}</div></div>${btn(icon('ellipsis'),'tab-menu',t.id,'plain')}<div class="actions">${btn(t.hidden?'Show in navigation':'Hide','toggle-hide',t.id,'plain')}${t.type==='browser'?btn(t.loaded?'Unload':'Load','toggle-load',t.id,'plain'):''}${btn('Move…','move',t.id,'plain')}${btn('Close…','close-tab',t.id,'plain')}</div></div>`).join('')||'<p>No tabs.</p>';}
function sourceRows(chat=false){const groups=sourceGroups(ws());const query=s.sourceQuery.toLowerCase();return groups.map(g=>{const entries=g.items.filter(i=>(!g.retired||(g.retainedItems?.[s.w]||[]).includes(i[0]))&&(!query||[...i,g.path].join(' ').toLowerCase().includes(query)));if(!entries.length)return '';return `<details class="source-group" open><summary>${esc(g.name)} ${g.retired?pill('Retained selection'):''}<span class="tag">${entries.length}</span><div class="path muted small">${esc(g.path)}</div></summary>${entries.map(([id,name,type,mode])=>{const selected=s.sourceModes[s.w+':'+id]||mode;return `<div class="source-row"><div><strong>${esc(name)}</strong> ${pill(type)}<div class="helper">${type==='MCP'?'Tool connection · actions use permission rules':type==='skill'?'Reusable workflow instructions':type==='agent'?'Agent role and instructions':'Text supplied to the agent'}</div></div><select data-source-mode="${id}" aria-label="Load ${esc(name)}">${[['default',chat?'Use workspace default':'Use by default'],['choose','Choose per chat'],['off','Off']].map(([v,l])=>`<option value="${v}" ${selected===v?'selected':''}>${l}</option>`).join('')}</select></div>`;}).join('')}</details>`;}).join('')||'<p class="muted">No matching sources.</p>';}
function configuration(){return heading(ws().name+' configuration','Shared by every project in this workspace.')+`<div class="section-tabs">${[['folders','Working folders'],['sources','Instructions & tools'],['access','Access & automation']].map(([id,l])=>btn(l,'config-section',id,(s.configTab||'folders')===id?'active':'')).join('')}</div>`+((s.configTab||'folders')==='folders'?`<section class="panel"><div class="row between"><div><h2>Working folders</h2><p class="helper">Project files the agent works on. Choose access for each folder.</p></div>${btn('+ Folder','add-folder')}</div>${ws().folders.map((f,i)=>`<div class="folder-row"><div><div class="path">${esc(f.path)}</div><div class="row small muted">${f.start?pill('Starting folder'):btn('Use as starting folder','start-folder',String(i),'plain')}</div></div><select data-folder-access="${i}" aria-label="Access to ${esc(f.path)}">${[['ask','Ask when needed'],['read','Read'],['edit','Read & edit']].map(([v,l])=>`<option value="${v}" ${f.access===v?'selected':''}>${l}</option>`).join('')}</select></div>`).join('')}<details><summary>What does folder access cover?</summary><p class="helper">Applies to files and subfolders at this location. Commands and connected services follow Access & automation. Adding a folder does not approve every tool.</p></details></section><section class="panel"><h2>Chat defaults</h2><p class="helper">New project chats inherit this workspace. Existing chats keep their recorded working setup.</p><div class="row">${pill('Default project: '+projects.find(p=>p.w===s.w&&p.default)?.name)}${btn('Manage projects','section','projects','plain')}</div></section>`:(s.configTab==='sources'?`<div class="row between"><div><h2>Instructions & tools</h2><p class="helper">Choose what chats receive. This does not grant tool permissions.</p></div>${btn('View global library','engine-section','library','plain')}</div><label class="field">Find a source<input data-source-query value="${esc(s.sourceQuery)}" placeholder="Name, type or folder"></label><div data-source-list>${sourceRows()}</div><section class="panel"><h2>Main agent</h2><p class="helper">The lead role for new chats. Other selected agents remain available.</p><select data-workspace-agent aria-label="Default main agent">${mainAgentOptions(ws(),ws().mainAgent)}</select></section><p class="helper">Library folders are managed once in Engine Room. Selected helper files can receive narrow read access. This does not make source folders writable.</p>`:permissionsConfig()));}
function permissionsConfig(){return `<section class="panel"><h2>Automation</h2><p class="helper">Workspace default for new chats. Each chat can override it.</p>${[['autopilot','Autopilot','Routine work within the access you chose. Ask before consequential actions.'],['ask','Ask for new actions','Use saved permissions; ask for anything not covered.']].map(([v,l,d])=>`<label class="permission-option"><input type="radio" name="automation" data-mode value="${v}" ${ws().mode===v?'checked':''}><div><strong>${l}</strong><span>${d}</span></div></label>`).join('')}<details><summary>What Autopilot can do</summary><div class="mapping">${pill('Automatic','good')} Read permitted files, edit Read & edit folders, browse shared tabs.</div><div class="mapping">${pill('When bounded','good')} Run known local checks only with verified project-scoped execution; use tools verified as read-only.</div><div class="mapping">${pill('Ask first','warn')} Delete files, send messages, publish, change accounts, install software or run unbounded commands.</div></details>${btn('Try a permission request','permission-examples','','plain')}</section><section class="panel"><h2>Remembered permissions</h2><p class="helper">Exact access, visible scope, easy to revoke.</p>${s.permissionLog.filter(x=>x.w===s.w).map(x=>`<div class="folder-row"><div><strong>${esc(x.title)}</strong><div class="helper">${esc(x.scope==='workspace'?'Saved for '+ws().name:'This chat only · '+(chats.find(c=>c.id===x.chat)?.title||x.chat))}</div></div>${btn('Revoke','revoke',x.id,'plain')}</div>`).join('')}<details><summary>Advanced: unrestricted tools</summary><p class="helper">The existing Auto-approve tools mode also permits unbounded commands and service mutations. It is not the proposed Autopilot.</p>${btn('Review a chat’s broader access…','workspace-broad','','danger')}</details></section>`;}
function libraryPage(){return heading('Source library','Reusable instructions and tools, available to every workspace on this Mac.',btn('+ Source folder','add-library','','primary'))+`<div class="notice small">Add locations here. Choose what to use in Workspace → Configuration → Instructions & tools.</div>${libraries.filter(g=>!g.retired).map(g=>`<section class="panel"><div class="row between"><div><h2>${esc(g.name)}</h2><div class="path muted">${esc(g.path)}</div></div>${btn('Remove…','remove-library',g.id,'plain')}</div><p class="helper">${g.items.length} discovered sources · available in all ${workspaces.length} workspaces</p><details><summary>Discovered items</summary>${g.items.map(i=>`<div class="mapping">${esc(i[1])} ${pill(i[2])}</div>`).join('')}</details></section>`).join('')}<div class="row">${btn('+ Individual document','add-library','','plain')}${btn('Refresh library','refresh-library','','plain')}</div><p class="helper">Configured on Build Mac. Another computer manages its own local paths.</p>`;}
function projectPage(){if(s.item){const item=findTab(s.item);if(!item){s.item=null;return projectPage();}return item.type==='chat'?chatPage(item):resourcePage(item);}return crumb()+`<div class="section-tabs">${btn('Chats','project-page','chats',s.projectPage==='chats'?'active':'')}${btn('Tabs','project-page','tabs',s.projectPage==='tabs'?'active':'')}${btn('Workspace settings','configure','','plain')}</div>`+(s.projectPage==='tabs'?tabsPage():chatsPage());}
function chatPage(c){const events=c.permissionEvents||[];return crumb(c.p)+heading(c.title,`${pill('Sample conversation')} · ${c.provider||'Codex'}`,btn('Move…','move',c.id)+btn('Details','chat-setup',c.id,'plain'))+`${s.screen==='quick'?`<div class="notice small">Quick view · belongs to ${esc(workspaces.find(w=>w.id===cw(c))?.name)} / ${esc(pname(c.p))} ${btn('Open in project','open-chat',c.id,'plain')}${btn('Close quick view','close-quick',c.id,'plain')}</div>`:''}${c.execution!==cw(c)?`<div class="notice small">Organized in ${esc(pname(c.p))}. Working setup retained from ${esc(c.setup.name)}. ${btn('View setup','chat-setup',c.id,'plain')}</div>`:''}<div class="message user"><div class="eyebrow">User · sample</div>Review the navigation, save the design notes, and put a summary in /workspace/reports.</div><div class="message"><div class="eyebrow">Assistant · sample</div><p>The design notes are ready. I need permission to save the summary in the reports folder.</p>${pathLink('/workspace/studio/docs/design-notes.md')}${pathLink('/workspace/studio/docs','folder')}${pathLink('https://example.com/design/components','browser')}<details ${events.length?'open':''}><summary>Activity · ${2+events.length} tools · permission decisions</summary><p class="helper">Read project files · workspace Read access.<br>Update design notes · workspace Read & edit access.</p>${events.map(e=>`<div class="mapping small">${esc(e)}</div>`).join('')}</details></div>${c.stale?`<div class="notice">Sources changed. Refresh before sending. ${btn('Refresh sources','refresh-source',c.id)}</div>`:''}${c.messages.map(m=>`<div class="message ${m.role==='user'?'user':''}"><div class="eyebrow">${esc(m.role)} · ${m.role==='user'?'Received':'sample response'}</div>${esc(m.text)}</div>`).join('')}<details class="demo-options"><summary>Try a permission example</summary><div class="row"><label class="field">Sample action<select data-request-demo>${[['folder','Edit a new folder'],['read','Read an approved folder'],['test','Run bounded project tests'],['helper','Read a skill’s supporting files'],['mcp','Read connected service'],['command','Run an unbounded command'],['send','Send a message'],['delete','Delete files']].map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></label>${btn('Try request','preview-request',c.id)}</div>${btn('Preview changed source','changed-source',c.id,'plain')}</details>${inlinePermission(c)}<div class="composer"><textarea data-draft="${c.id}" aria-label="Message" placeholder="${c.pendingPermission?'Add an update while waiting…':'Message…'}">${esc(c.draft)}</textarea><div class="composer-footer"><span>${c.provider||'Codex'} · workspace defaults</span>${btn(chatMode(c)==='autopilot'?'Autopilot':chatMode(c)==='broad'?'Auto-approve tools':'Ask for new actions','chat-mode',c.id,'plain')}${btn(icon('arrow-up')+'Send','send',c.id,'primary')}</div></div><p class="helper">Design rehearsal · proposed permissions · no real actions.</p>`;}
function resourcePage(t){let body;if(t.type==='browser')body=`<div class="row">${icon('globe')}<span class="path">${esc(t.url)}</span>${pill(t.profile)}${pill('Agent access available','good')}</div><div class="browser-page"><h2>${esc(t.title)}</h2><p class="muted">${t.loaded?'Sample loaded page · no external site requested':'Saved tab · page has not been loaded'}</p>${btn(t.loaded?'Unload page':'Load page','toggle-load',t.id,t.loaded?'':'primary')}</div>`;else if(t.type==='terminal')body=`<p class="helper">Session ${t.session} · retained across moves</p><pre>studio % pwd\n/workspace/studio\n\nstudio % npm test\nSample checks passed.\n\nstudio % ▋</pre><p class="helper">Terminal preview · no commands execute.</p>`;else body=`<div class="row between"><span class="path">${esc(t.url)}</span>${btn('Refresh','refresh-doc',t.id,'plain')}</div><div class="row small muted">${pill('Version '+t.version)}${t.pending?pill('New saved version available','good'):''}${btn('Simulate file update','change-doc',t.id,'plain')}</div><article class="document-reader" data-reader="${t.id}"><h1>Design notes</h1><p>Saved version ${t.version}. Sample document for refresh and scroll behavior.</p>${Array.from({length:16},(_,i)=>`<h2>${i+1}. ${['Navigation','Workspace structure','Project tabs','Source selection'][i%4]}</h2><p>Keep the working environment separate from where a conversation is organized. A project gives related chats and resource tabs a shared home. This sample section keeps the reading position visible during refresh.</p>`).join('')}</article>`;return crumb(t.p)+heading(t.title,`${pill(t.type)} · ${pill(t.hidden?'Hidden':'Visible')}`,btn('Move…','move',t.id)+btn('Tab actions','tab-menu',t.id,'plain'))+body;}
function migrationPage(){return heading('Keep everything in place','Migration proposal · synthetic inventory',btn(s.migration?'Review complete':'Run sample review','migration-review','','primary'))+`<div class="comparison"><div><h2>Existing organization</h2><div class="mapping">Studio workspace<br><span class="muted">Chats, browser tabs, terminals, documents</span></div><div class="mapping">Application / Team Tools<br><span class="muted">Quick views and unassigned resources</span></div><div class="mapping">Per-workspace source folders<br><span class="muted">Repeated locations, different selections</span></div></div><div><h2>Proposed home</h2><div class="mapping">Studio workspace + General project<br><span class="muted">Chats enter General; workspace resource tabs keep their placement, IDs and sessions</span></div><div class="mapping">Existing home retained<br><span class="muted">Main / Team Tools / unassigned stay explicit; review ambiguous items. Quick views retain their original chat</span></div><div class="mapping">Engine Room → Source library<br><span class="muted">Deduplicated locations; workspace selections stay scoped</span></div></div></div><section class="panel"><h2>Review before applying</h2><p class="helper">Existing open views stay open. Organization changes do not restart work.</p>${[['24 conversations','History, drafts, archived state, active turn and provider session'],['18 resource tabs','URLs, Back/Forward history, profile, terminal session and document approval origin'],['6 hidden / unloaded tabs','Visibility and load state retained without opening pages'],['4 schedules','Enabled state, next run and captured workflow settings retained'],['8 source locations','5 unique paths; selections and permissions remain per workspace']].map(([title,sub])=>`<div class="mapping"><div class="row between"><strong>${title}</strong>${s.migration?pill('Sample mapping verified','good'):pill('To review')}</div><span class="helper">${sub}</span></div>`).join('')}<details><summary>Recovery and existing permissions</summary><p class="helper">Record an idempotent mapping and rollback receipt before activation. Preserve unknown fields and existing grants; flag legacy broad auto-approval for review without silently converting it to safe Autopilot. Use the existing two-generation recovery policy.</p></details>${s.migration?'<div class="notice">Sample review passed. No real migration was performed.</div>':''}</section>`;}
function agentsPage(){return heading('Agent capabilities','Same destinations and actions as the interface.')+`<section class="panel"><h2>Find the right home</h2><p class="helper">Workspace → fixed views or resource tabs; Project → chat and resource tabs. Available actions and restrictions come from the owning host.</p><div class="row">${btn('Preview inventory','agent-inventory','','primary')}${btn('Preview move','agent-move','','plain')}${btn('Add unloaded tabs','add-tab','','plain')}</div><pre data-agent-output>${esc('list workspaces → list projects → list tabs\n\nEach result includes owner, stable IDs, revision, project,\nvisibility, load state and supported operations.')}</pre></section><section class="panel"><h2>Consistent actions</h2><div class="mapping">Move chat → Workspace + Project; move resources → Workspace tabs or a Project</div><div class="mapping">Create browser tabs → profile + visible/hidden + loaded/unloaded</div><div class="mapping">Hide / show, unload / load, close → typed resource behavior</div><div class="mapping">Read and control → same tab permissions in every browser profile</div><p class="helper">Proposed capability preview. These controls do not register tools or operate real tabs.</p></section>`;}
function permissionsExamples(){return heading('Permission examples','Sample chat: '+permissionChat().title+' · '+permissionChat().setup.name+' permissions')+`<div class="grid2">${[['read','Read project files','Already permitted · no interruption'],['test','Run project tests','Autopilot when execution is bounded'],['folder','Edit a new folder','Choose folder access and scope'],['mcp','Read connected service','Grant an exact read capability'],['helper','Read skill helper files','Narrow read-only source access'],['command','Run an unbounded command','Provider cannot contain execution'],['send','Send a message','Review the external action'],['delete','Delete files','Review the affected files']].map(([id,t,d])=>`<section class="panel"><h2>${t}</h2><p class="helper">${d}</p>${btn('Try request','permission',id,'primary')}</section>`).join('')}</div>`;}
function workspaceIndex(){return heading('Workspaces','Working environments, organized into projects.',btn('+ Workspace','new-workspace','','primary'))+workspaces.map(w=>`<section class="panel"><div class="row between"><div>${btn(icon('panels-top-left')+esc(w.name),'workspace',w.id,'project-name')}<p class="helper">${projects.filter(p=>p.w===w.id).length} projects · ${w.folders.length} working folders</p></div>${w.id==='default'?pill('Application default'):''}</div><div class="path muted">${esc(starting(w).path)}</div></section>`).join('');}
function render(){const previous=$('[data-reader]');if(previous){const t=resources.find(t=>t.id===previous.dataset.reader);if(t)t.scroll=previous.scrollTop;}const app=$('[data-app]');app.className=`app ${s.platform} ${s.drawer?'drawer':''} ${pref.compact?'compact':''}`;$('[data-platform]').value=s.platform;$('[data-sidebar]').innerHTML=sidebar();$('[data-top]').innerHTML=topnav();const secondary=subnav();$('[data-sub]').innerHTML=secondary;$('[data-sub]').hidden=!secondary;let html='';if(s.screen==='workspace')html=s.item&&findTab(s.item)?resourcePage(findTab(s.item)):s.section==='projects'?projectList():s.section==='chats'?chatsPage():s.section==='tabs'?tabsPage():configuration();else if(s.screen==='project')html=projectPage();else if(s.screen==='quick')html=chatPage(chats.find(c=>c.id===s.item)||chats[0]);else if(s.screen==='chats')html=chatsPage(true);else if(s.screen==='engine')html=s.section==='library'?libraryPage():s.section==='migration'?migrationPage():s.section==='agents'?agentsPage():permissionsExamples();else if(s.screen==='index')html=s.section==='chats'?chatsPage():workspaceIndex();else html=heading(s.section||'Home','Application-level view')+`<section class="panel"><p>Open a chat for quick reference, or choose a project for focused work.</p>${btn('All chats','global-chats','','primary')}${btn('New chat','new-chat','d-general','plain')}</section>`;$('[data-main]').innerHTML=html;const reader=$('[data-reader]');if(reader){reader.scrollTop=resources.find(t=>t.id===reader.dataset.reader)?.scroll||0;reader.onscroll=()=>{resources.find(t=>t.id===reader.dataset.reader).scroll=reader.scrollTop;};}if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
function dialog(title,body,footer=''){const d=$('[data-dialog]');d.innerHTML=`<div class="dialog-top"><h2>${esc(title)}</h2>${btn('×','dialog-close','','plain')}</div>${body}<div class="error" data-error role="alert"></div>${footer?`<div class="dialog-actions">${btn('Cancel','dialog-close')}${footer}</div>`:''}`;if(!d.open)d.showModal();if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});setTimeout(()=>d.querySelector('input:not([type=checkbox]):not([type=radio]),textarea,select')?.focus(),0);}
function closeDialog(){$('[data-dialog]').close();}
function destinationOptions(w,current,allowWorkspace=false){return (allowWorkspace?`<option value="workspace:${w}" ${current==='workspace:'+w?'selected':''}>Workspace tabs · no project</option>`:'')+projectOptions(w,current);}

 'chat-setup':id=>{const c=chats.find(c=>c.id===id),w=c.setup;dialog('Chat details',`<h3>Organizational home</h3><p>${esc(workspaces.find(w=>w.id===cw(c)).name)} / ${esc(pname(c.p))}</p><h3>Working setup</h3><p class="helper">Captured from ${esc(w.name)}. Moving the chat keeps this setup.</p><p class="path">${esc(w.start)}</p>${w.folders.map(f=>`<div class="mapping small"><span class="path">${esc(f.path)}</span> · ${esc(f.access==='edit'?'Read & edit':f.access==='read'?'Read':'Ask when needed')}</div>`).join('')}${pill(chatMode(c)==='autopilot'?'Autopilot':chatMode(c)==='broad'?'Unrestricted tools':'Ask for new actions')}${btn('Permissions','chat-mode',id,'plain')}<h3>Main agent</h3><p>${esc(w.sources.find(i=>i.id===w.mainAgent)?.name||'Default assistant')}</p><h3>Selected sources</h3>${w.sources.map(i=>`<div class="mapping">${esc(i.name)} ${pill(i.type)}</div>`).join('')||'<p class="muted">No sources selected.</p>'}${w.helperReads.length?`<h3>Read-only helper access</h3>${w.helperReads.map(path=>`<div class="path mapping">${esc(path)}</div>`).join('')}`:''}<details><summary>Change setup for future turns</summary><p class="helper">Review folders, sources and permissions separately. Active turns retain their current setup.</p>${btn('Review original workspace setup','review-setup',id)}${c.execution!==cw(c)?btn('Compare destination setup','compare-setup',id):''}</details>`,btn('Done','dialog-close','','primary'));},'review-setup':id=>{const c=chats.find(c=>c.id===id);closeDialog();s.configTab='access';navigate('workspace',c.execution,c.p,'configuration');},
 'chat-mode':chatControls,'apply-chat-mode':id=>{const c=chats.find(c=>c.id===id);c.mode=$('[name="chat-mode"]:checked').value;$$('[data-chat-folder]').forEach(el=>c.setup.folders[Number(el.dataset.chatFolder)].access=el.value);closeDialog();render();toast('Automation saved for this chat only.');},
 'allow-permission':()=>{const c=permissionChat(),r=resolvedRequest(s.request,c),scope=$('[data-permission-scope]').value;if(scope!=='once')s.permissionLog.push({id:'grant-'+(++seq),request:s.request,target:r.target,rule:r.rule,title:r.rule+' · '+r.target,scope,w:c.execution,chat:scope==='chat'?c.id:null});c.permissionEvents.push('Approved '+(scope==='once'?'once':scope==='chat'?'for this chat':'for '+c.setup.name)+' · '+r.action+' · '+r.target);c.pendingPermission=null;closeDialog();render();toast(scope==='once'?'Approved once.':`Permission remembered for ${scope==='chat'?'this chat':'this workspace'}.`);status('Sample permission applied; no real operation executed.');},'deny-permission':()=>{const c=permissionChat();c.permissionEvents.push('Denied · '+requests[s.request].action);c.pendingPermission=null;closeDialog();render();toast('Request denied. Chat can choose another approach.');},revoke:id=>{s.permissionLog=s.permissionLog.filter(g=>g.id!==id);render();toast('Saved permission revoked in this sample.');},
'broad-access':()=>dialog('Unrestricted tools · '+permissionChat().title,`<div class="notice warning">Commands may use the runner’s filesystem and network. Service tools may change external data.</div><p class="helper">This is the existing broad Auto-approve tools behavior. It is separate from the proposed safe Autopilot.</p><label class="checkrow"><input type="checkbox" data-broad-confirm>I understand the broader access for this chat</label>`,btn('Enable for this chat','confirm-broad','','danger')),'confirm-broad':()=>{if(!$('[data-broad-confirm]').checked){$('[data-error]').textContent='Review and acknowledge the broader scope.';return;}permissionChat().mode='broad';closeDialog();render();toast('Broad mode selected for the sample chat only.');},
'migration-review':()=>{s.migration=true;render();toast('Synthetic migration mapping checked; no real data changed.');},'agent-inventory':()=>{$('[data-agent-output]').textContent=JSON.stringify({owner:'sample-mac',workspace:ws().name,project:pr()?.name,tabs:allTabs().filter(t=>t.p===s.p).map(t=>({id:t.id,type:t.type,hidden:t.hidden,loaded:t.type==='browser'?t.loaded:undefined})),capabilities:['move','hide','show','create-unloaded','close']},null,2);},'agent-move':()=>{$('[data-agent-output]').textContent='Preview only — no move performed:\nProposed action: Move website shell\nFrom: Studio / Website refresh\nTo: Studio / General\n\nSame tab ID and shell session.\nOwner revision checked; retry keeps operation identity.\nNext step: execute once, then verify the destination inventory.';},
reattach:id=>{const t=s.detached.find(t=>t.id===id);if(t){resources.push(t);s.detached=s.detached.filter(x=>x.id!==id);openTab(id);toast('Same shell session reattached.');}},'end-terminal':id=>{const t=findTab(id);dialog('End this shell?',`<p>Session ${esc(t.session)}</p><p class="helper">Stops the shell and its running commands. Detach preserves the session instead.</p>`,btn('End shell','confirm-end',id,'danger'));},'confirm-end':id=>{const t=findTab(id);resources.splice(resources.indexOf(t),1);closeDialog();s.item=null;render();toast('Sample shell ended.');},'compare-setup':id=>{const c=chats.find(c=>c.id===id),w=workspaces.find(w=>w.id===cw(c));dialog('Compare working setups',`<div class="comparison"><div><h3>Current · ${esc(c.setup.name)}</h3><p class="path">${esc(c.setup.start)}</p><p>${c.setup.sources.length} captured sources</p></div><div><h3>Destination · ${esc(w.name)}</h3><p class="path">${esc(starting(w).path)}</p><p>${sourceChoices(w).filter(i=>i.mode==='default').length} default sources</p></div></div><p class="helper">Moving already changed the organizational home. Applying a new execution setup would be a separate reviewed change between turns.</p><div class="notice small">This rehearsal stops at comparison. Existing chat grants remain attached to the original setup.</div>`,btn('Keep current setup','dialog-close','','primary'));},'close-quick':id=>{s.quick=s.quick.filter(x=>x!==id);navigate('chats');toast('Quick view closed; project chat retained.');},'dialog-close':closeDialog,dismiss:()=>$('[data-toast]').hidden=true};
root.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||!root.contains(b))return;const a=b.dataset.act;if(actions[a]){actions[a](b.dataset.id,b);save();}else if(['schedules','searches','transcription','life','team'].includes(a))navigate('other',s.w,s.p,{schedules:'Schedules',searches:'Internet Searches',transcription:'Transcription',life:'Life',team:'Team Tools'}[a]);});
root.addEventListener('input',e=>{if(e.target.matches('[data-draft]'))chats.find(c=>c.id===e.target.dataset.draft).draft=e.target.value;if(e.target.matches('[data-chat-filter="query"]')){chatFilters().query=e.target.value;$('[data-chat-index-rows]').innerHTML=chatIndexRows();}if(e.target.matches('[data-source-query]')){s.sourceQuery=e.target.value;$('[data-source-list]').innerHTML=sourceRows();}});
root.addEventListener('change',e=>{const t=e.target;if(t.matches('[data-chat-filter]')){chatFilters()[t.dataset.chatFilter]=t.type==='checkbox'?t.checked:t.value;$('[data-chat-index-rows]').innerHTML=chatIndexRows();}if(t.matches('[data-project-tab]')){if(t.value)openTab(t.value);else navigate('project');}if(t.matches('[data-project-filter]')){s.projectFilter=t.value;render();}if(t.matches('[data-type-filter]')){s.typeFilter=t.value;render();}if(t.matches('[data-workspace-agent]'))ws().mainAgent=t.value;if(t.matches('[data-use-defaults]'))$$('[data-new-source]').forEach(i=>i.checked=t.checked&&i.dataset.default==='true');if(t.matches('[data-new-source]'))$('[data-use-defaults]').checked=false;if(t.matches('[data-platform]')){s.platform=t.value;render();save();}if(t.matches('[data-scene]')){s.w='studio';s.p='website';s.item=null;s.projectPage='chats';if(t.value==='workspace')navigate('workspace','studio','website','projects');if(t.value==='config'){s.configTab='sources';navigate('workspace','studio','website','configuration');}if(t.value==='permissions'){openTab('c1');chats[0].pendingPermission='folder';render();}if(['library','migration','agents'].includes(t.value))navigate('engine','studio','website',t.value);if(t.value==='chat')openTab('c1');if(t.value==='tabs'){s.projectPage='tabs';navigate('project','studio','website');}}if(t.matches('[data-move-workspace]'))$('[data-move-project]').innerHTML=destinationOptions(t.value,projects.find(p=>p.w===t.value&&p.default)?.id,s.moveType!=='chat');if(t.matches('[data-tab-filter]')){s.tabFilter=t.value;render();}if(t.matches('[data-source-mode]')){s.sourceModes[s.w+':'+t.dataset.sourceMode]=t.value;status('Source choice saved for '+ws().name+' only.');}if(t.matches('[data-folder-access]')){ws().folders[Number(t.dataset.folderAccess)].access=t.value;status('Folder access updated for '+ws().name+' · sample only.');}if(t.matches('[data-mode]')){ws().mode=t.value;status('New chat automation default saved.');}if(t.matches('[data-add-type]')){$('[data-browser-fields]').hidden=t.value!=='browser';$('[data-other-fields]').hidden=t.value==='browser';}if(t.matches('[data-permission-scope]')){const r=requests[s.request];const approve=$('[data-act="allow-permission"]');if(approve&&!r.once)approve.textContent=({once:'Allow once',chat:'Allow for this chat',workspace:'Save for this workspace'}[t.value]);$('[data-scope-explanation]').textContent=scopeExplanation(r,t.value,permissionChat());}save();});
root.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&e.target.matches('[data-workspace-name]')){e.preventDefault();actions['confirm-workspace']();}if(e.key==='Enter'&&!e.isComposing&&e.target.matches('[data-project-name]')){e.preventDefault();const b=$('[data-dialog] .dialog-actions button.primary');b?.click();}});
root.addEventListener('contextmenu',e=>{const b=e.target.closest('[data-act="open-tab"],[data-act="open-chat"]');if(b){e.preventDefault();tabMenu(b.dataset.id);}});
render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addToggle(pref,'compact',{label:'Compact project rows'});tweak.addToggle(pref,'expandChats',{label:'Expand recent chats by default'});}
})();
