    if(action==='nav')openNav(i);else if(action==='nav-close')closeNav(i);else if(action==='overview')showOverview(i);else if(action==='overview-close'){if(currentTab(i))openFromOverview(i,i.current);else navigate(i,'home',false)}else if(action==='add'||action==='share'||action==='address')sheet(i,action);else if(action==='browser-menu')sheet(i,'menu');else if(action==='sheet-close')closeSheet(i);else if(action==='collapse'){i.nav.querySelector('.ip-tree-content').hidden=!i.nav.querySelector('.ip-tree-content').hidden}else if(action==='open-notes')navigate(i,'notes');else if(action==='open-reading')navigate(i,'read');else if(action==='web-next'||action==='browser-forward'){const tab=currentTab(i);if(tab?.type==='browser'){tab.page=tab.page===1?0:1;tab.title=tab.page===1?'The long way home':'A little room to wander';replacePage(i);persist()}}else if(action==='browser-back'){const b=beginBack(i);if(b){moveBack(b,0);finishBack(i,b,true)}}else if(action==='send'){toast(i,'Sample only · your draft stays here')}else if(action==='sample-option'||action==='sample-address'){closeSheet(i);toast(i,'Design rehearsal · sample page')}
  }
  function bindGestures(i){
    let gesture=null;const points=new Map();
    const local=e=>{const r=i.screen.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};

    i.phone.addEventListener('keydown',e=>{if(e.key==='Escape'){if(i.nav)closeNav(i);else if(i.sheet)closeSheet(i);else if(i.overview)openFromOverview(i,i.current);else demoBack(i)}});
  }
  root.querySelectorAll(':scope > section').forEach((variant,mode)=>{
    const prior=saved.instances?.find(s=>s.variant===mode),i={mode,variant,tabs:prior?.tabs?.length?prior.tabs:structuredClone(initialTabs),current:prior?.current||'read',history:['home','Workspaces','General','plan'],draft:prior?.draft||'',overview:false,scrolls:{},serial:10,busy:false,nav:null,sheet:null,ignoreClickUntil:0};
    variant.innerHTML=`<div class="ip-stage"><div class="ip-rehearsal-label">${icon('smartphone')}iPhone · design rehearsal</div><div class="ip-phone" aria-label="${['Button drawer','Right-edge drawer','Upper-left pull'][mode]} iPhone preview"><div class="ip-status"><span>9:41</span><div class="ip-island"></div><div class="ip-status-icons">${icon('signal')}${icon('wifi')}${icon('battery-full')}</div></div><div class="ip-screen"></div><div class="ip-home-indicator"></div></div><div class="ip-rehearsal"><button type="button" class="cursor-interaction" data-demo="back">Rehearse swipe-back</button><button type="button" class="cursor-interaction" data-demo="pinch">Rehearse pinch to tabs</button></div></div>`;

  });
