pp-phone .pp-body{grid-template-columns:1fr}#proteus-project-design .pp-phone .pp-rail{display:none}#proteus-project-design .pp-phone .pp-canvas{padding:16px;gap:15px}#proteus-project-design .pp-phone .pp-tabs{display:none}#proteus-project-design .pp-phone .pp-message.pp-user{margin-left:15px}#proteus-project-design .pp-phone .pp-tab>button{max-width:165px;font-size:11px}#proteus-project-design .pp-phone .pp-full{padding:17px}#proteus-project-design .pp-phone .pp-fields{grid-template-columns:1fr}#proteus-project-design .pp-phone .pp-project-card{align-items:flex-start;flex-wrap:wrap}#proteus-project-design .pp-phone .pp-page{padding:20px}#proteus-project-design .pp-phone .pp-overlay{padding:40px 12px 20px}#proteus-project-design .pp-phone .pp-dialog{padding:20px}#proteus-project-design .pp-dense .pp-row,#proteus-project-design .pp-dense .pp-source{padding-top:8px;padding-bottom:8px}

<script>
(()=>{
const root=document.getElementById('proteus-project-design');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const btn=(a,t,cl='',extra='')=>`<button type="button" class="cursor-interaction ${cl}" data-action="${a}" ${extra}>${t}</button>`;
const initial=()=>({version:1,projects:[{id:'field',name:'Field guide',description:'Research, writing and a shared reference collection.',revision:3,folders:['Guide','Research'],sources:['brief','style','research','writer','browser'],provider:'Project default',agent:'Research assistant',tools:['Browser','Read files','Edit files'],chats:[{id:'launch',name:'Launch plan',subtitle:'Today · ready',messages:[]},{id:'sources',name:'Source shortlist',subtitle:'Yesterday',messages:[]},{id:'outline',name:'Chapter outline',subtitle:'Oct 8',messages:[]}],tabs:[{id:'launch',type:'chat',name:'Launch plan'},{id:'sources',type:'chat',name:'Source shortlist'},{id:'reference',type:'browser',name:'Reference guide',url:'https://example.com/guide'}]},{id:'site',name:'Website refresh',description:'Content, navigation and design decisions.',revision:1,folders:['Website'],sources:['brief','style','browser'],provider:'Project default',agent:'Writing assistant',tools:['Browser','Read files'],chats:[{id:'pages',name:'Page inventory',subtitle:'Today · ready',messages:[]}],tabs:[{id:'pages',type:'chat',name:'Page inventory'},{id:'site-ref',type:'browser',name:'Design reference',url:'https://example.com/design'}]}],mainTabs:[],next:10,views:{desktop:{project:'field',active:'launch',screen:'project',section:'folders',query:'',type:'All',drafts:{}},phone:{project:'field',active:'launch',screen:'project',section:'folders',query:'',type:'All',drafts:{}}}});
let model=initial();const saved=window.openai?.widgetState?.privateContent?.projectsDemo;if(saved?.version===1&&Array.isArray(saved.projects)&&saved.views)model=saved;
const design={offline:false,dense:false};let notices={desktop:'',phone:''};const transient={desktop:{},phone:{}};
const catalog=[{id:'brief',folder:'Guide',name:'Project brief',type:'Instructions',path:'Guide/AGENTS.md'},{id:'style',folder:'Guide',name:'Writing style',type:'Instructions',path:'Guide/instructions/style.md'},{id:'writer',folder:'Guide',name:'Writing assistant',type:'Agents',path:'Guide/agents/writer.md'},{id:'browser',folder:'Research',name:'Browser tools',type:'MCPs',path:'Research/mcp/browser.json'},{id:'research',folder:'Research',name:'Research assistant',type:'Agents',path:'Research/agents/research.md'},{id:'verify',folder:'Research',name:'Source verification',type:'Skills',path:'Research/skills/source-verification/SKILL.md'},{id:'synthesis',folder:'Research',name:'Synthesis',type:'Skills',path:'Research/skills/synthesis/SKILL.md'}];
const view=s=>model.views[s],project=s=>model.projects.find(p=>p.id===view(s).project)||model.projects[0];
function save(){if(JSON.stringify(model).length>14000)return;const selected=Object.fromEntries(Object.entries(model.views).map(([k,v])=>[k,{project:v.project,screen:v.screen,section:v.section}]));window.openai?.setWidgetState?.({modelContent:{preview:'Projects proposal',selected},privateContent:{projectsDemo:model}})?.catch(()=>{});}
function note(s,text){notices[s]=text;}
function openProject(s,id){const v=view(s);v.last??={};v.last[v.project]=v.active;v.project=id;v.openProjects??=['field','site'];if(!v.openProjects.includes(id))v.openProjects.push(id);const p=project(s);v.active=p.tabs.some(t=>t.id===v.last[id])?v.last[id]:(p.tabs[0]?.id||'');v.screen='project';delete transient[s].modal;delete transient[s].setup;}
function addBrowser(s,url='https://example.com/companion',name='Companion guide'){const p=project(s),id='tab-'+model.next++;p.tabs.push({id,type:'browser',name,url});view(s).active=id;view(s).screen='project';note(s,`Opened in ${p.name}.`);}
function config(s){return transient[s].setup||project(s);}
function top(s,p){return `<div class="pp-top"><span class="pp-brand">${icon('sprout')} Proteus</span>${model.projects.filter(q=>(view(s).openProjects||['field','site']).includes(q.id)).map(q=>btn('project',`${icon('folder')} ${esc(q.name)}`,'pp-main-tab',`data-id="${q.id}" aria-pressed="${view(s).screen!=='index'&&p.id===q.id}"`)).join('')}${model.mainTabs.map(t=>btn('maintab',icon('globe')+esc(t.name),'pp-main-tab',`data-id="${t.id}" aria-pressed="${view(s).screen==='mainbrowser'&&view(s).mainId===t.id}"`)).join('')}${btn('standalone',`${icon('message-square')} General chat`,'pp-main-tab')}${btn('index',`${icon('panels-top-left')} Projects`,'pp-mobile-only')}${btn('chats',`${icon('messages-square')} Chats`,'pp-mobile-only')}${btn('newproject',icon('plus'),'','aria-label="New project"')}</div>`;}
function sidebar(s,p){return `<aside class="pp-global">${btn('home',`${icon('house')} Home`)}${btn('allchats',`${icon('messages-square')} Chats`)}${btn('index',`${icon('folder')} Projects`,'',`aria-pressed="true"`)}<div class="pp-nav-title">Projects</div>${model.projects.map(q=>btn('project',esc(q.name),'pp-sub',`data-id="${q.id}" aria-pressed="${p.id===q.id&&view(s).screen!=='index'}"`)).join('')}${btn('newproject','+ New project','pp-sub')}<div class="pp-nav-title">Setup</div>${btn('presets',`${icon('folders')} Workspaces`)}<div class="pp-foot">${icon('circle-check')} This desktop<br>Design preview · sample data</div></aside>`;}
function header(s,p){const v=view(s);return `<header class="pp-header"><div><div class="pp-eyebrow">Project</div><h1>${esc(p.name)}</h1><small>${design.offline?'Execution host offline':s==='phone'?'Synced · runs on Studio Mac':'Synced · Studio Mac'} · setup v${p.revision}</small></div><div class="pp-actions">${btn('newchat',icon('plus')+' New chat','pp-primary')}${btn('setup',icon('sliders-horizontal')+' Setup','pp-outline')}${btn('hideproject',icon('x'),'','aria-label="Close project tab"')}</div></header>`;}
function tabs(s,p){const v=view(s);return `<div class="pp-tabs" aria-label="Project tabs">${p.tabs.map(t=>`<div class="pp-tab ${v.active===t.id?'pp-active':''}">${btn('tab',icon(t.type==='chat'?'message-square':'globe')+esc(t.name),'',`data-id="${t.id}" aria-pressed="${v.active===t.id}"`)}${btn('closetab','×','pp-close',`data-id="${t.id}" aria-label="Close ${esc(t.name)} tab"`)}</div>`).join('')}${btn('newtab',icon('plus'),'','aria-label="New browser tab in project"')}</div><div class="pp-mobile-tabs pp-mobile-only">${btn('tabs',icon('panels-top-left')+esc(p.tabs.find(t=>t.id===v.active)?.name||'Project tabs')+' · '+p.tabs.length,'pp-outline')}${btn('newtab',icon('plus'),'','aria-label="New browser tab in project"')}</div>`;}
function rail(s,p){return `<aside class="pp-rail"><div class="pp-rail-title"><strong>Project chats</strong><small>${p.chats.length}</small></div>${btn('newchat',icon('plus')+' New chat','pp-outline pp-new')}${p.chats.map(c=>btn('chat',`<span>${esc(c.name)}</span><small>${esc(c.subtitle)}</small>`,'',`data-id="${c.id}" aria-pressed="${view(s).active===c.id}"`)).join('')}<div class="pp-muted" style="padding:20px 5px">All chats in ${esc(p.name)}, including closed tabs.</div></aside>`;}
function chat(s,p,t){const c=p.chats.find(c=>c.id===t?.id);if(!c)return `<div class="pp-canvas"><h2>Your project is ready</h2><p class="pp-muted">Open a chat from the project list, or start a new one with this project's setup.</p>${btn('newchat','New chat','pp-primary')}${p.closed?.length?btn('reopen','Reopen last closed browser tab','pp-outline'):''}</div>`;const draft=view(s).drafts[c.id]||'';return `<div class="pp-canvas"><div class="pp-chat-heading"><div><h2>${esc(c.name)}</h2><small>${esc(p.agent)} · project setup v${p.revision}</small></div>${btn('setup',icon('layers'),'','aria-label="View inherited project setup"')}</div>${c.id==='launch'?`<div class="pp-message pp-user"><p>Help me turn our research into a practical field guide.</p></div><div class="pp-message"><div class="pp-eyebrow">Assistant</div><p>I'll use the project brief, writing style and research tools already selected for <strong>${esc(p.name)}</strong>.</p><ul><li>Gather the strongest references.</li><li>Develop a chapter outline.</li><li>Keep writing decisions in this project.</li></ul>${btn('reference','Open reference guide ↗','pp-link')}</div>`:!c.messages.length?`<div class="pp-message"><div class="pp-eyebrow">Project context ready</div><p>${esc(p.folders.join(' + '))} folders, ${p.sources.length} selected sources and ${esc(p.agent)} are inherited. What would you like to work on?</p></div>`:''}${c.messages.map(m=>m.kind==='receipt'?`<div class="pp-message pp-receipt"><div class="pp-eyebrow">Project updated · v${m.revision}</div><p>Added <strong>Reference library</strong> to ${esc(p.name)}. It will be available after context refresh; future project chats inherit it.</p><div class="pp-actions" style="margin-top:10px">${btn('setup','View setup','pp-outline')}${p.folders.includes('Reference library')?btn('undofolder','Undo'):''}</div></div>`:`<div class="pp-message ${m.kind==='user'?'pp-user':''}">${esc(m.text)}</div>`).join('')}${!p.folders.includes('Reference library')?`<div class="pp-actions">${btn('addfromchat',icon('folder-plus')+' Add the reference folder to this project','pp-outline')}</div>`:''}<div class="pp-composer"><textarea data-input="draft" data-chat="${c.id}" aria-label="Message in ${esc(p.name)}" placeholder="Message ${esc(p.name)}…">${esc(draft)}</textarea><div class="pp-composer-bottom"><small>Project defaults · ${p.sources.length} sources${design.offline?' · host offline':''}</small>${btn('send',icon('arrow-up'),'pp-primary',`aria-label="Send message" ${design.offline?'disabled':''}`)}</div></div></div>`;}
function browser(s,p,t){return `<div class="pp-canvas"><form class="pp-browserbar" data-form="address"><input name="url" aria-label="Browser address" value="${esc(t.url||'')}" placeholder="Search or enter address"><button type="button" data-submit class="cursor-interaction pp-outline">Go</button>${btn('transfer',icon('arrow-right-left')+' Send tab','pp-outline')}</form><div class="pp-page"><div class="pp-eyebrow">${t.url?'Example reference site':'New tab'}</div><h2>${esc(t.url?t.name:'Where next?')}</h2><p>${t.url?'A practical collection of reading, research methods and useful examples.':'Browser tabs opened here stay with this project.'}</p>${t.url?`<p class="pp-muted">${esc(t.url)}</p>${btn('link','Open companion guide in a new tab ↗','pp-link')}<div class="pp-row"><div><strong>About this collection</strong><small>Reference material for your next chapter.</small></div>${icon('book-open')}</div>`:`${btn('reference',icon('history')+' Reference guide','pp-outline')}<small>Recent history</small>`}</div><small>In ${esc(p.name)} · ${s==='phone'?'uses this phone’s website logins':'Studio Mac browser profile'}</small></div>`;}
function index(s){return `<div class="pp-full"><div class="pp-chat-heading"><div><div class="pp-eyebrow">Your work, kept together</div><h1>Projects</h1></div>${btn('newproject',icon('plus')+' New project','pp-primary')}</div><div class="pp-list">${model.projects.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<div class="pp-project-card"><div><h2>${esc(p.name)}</h2><p>${esc(p.description)}</p><small>${p.chats.length} chats · ${p.tabs.filter(t=>t.type==='browser').length} browser tabs · setup v${p.revision}</small></div>${btn('project','Open project →','pp-outline',`data-id="${p.id}"`)}</div>`).join('')}</div><small>Closing a project tab keeps its chats, tabs and setup here.</small>${model.mainTabs.length?`<div class="pp-section"><h3>Main navigation browser tabs</h3>${model.mainTabs.map(t=>`<div class="pp-row"><div>${esc(t.name)}<small>${esc(t.url)}</small></div><span class="pp-chip">Main navigation</span></div>`).join('')}</div>`:''}</div>`;}
function sourceList(s){const v=view(s),p=config(s),q=v.query.toLowerCase();const hits=catalog.filter(x=>[x.name,x.path,x.folder,x.type].some(z=>z.toLowerCase().includes(q)));return `<div class="pp-section"><input data-input="sources" aria-label="Filter all source sections" placeholder="Filter all folders, names, paths and types" value="${esc(v.query)}"><div class="pp-actions">${['All','Instructions','Skills','Agents','MCPs'].map(type=>btn('type',`${type} <small>${hits.filter(x=>type==='All'||x.type===type).length}</small>`,'',`data-type="${type}" aria-pressed="${v.type===type}"`)).join('')}</div><small>${p.sources.length} selected for every chat in this project</small><div data-source-results>${groups(s,hits)}</div></div>`;}
function groups(s,hits){const v=view(s),p=config(s),items=hits.filter(x=>v.type==='All'||v.type===x.type);return [...new Set(items.map(x=>x.folder))].sort().map(folder=>`<section class="pp-group">${btn('collapse',icon('folder')+folder,'pp-group-title',`data-folder="${folder}" aria-expanded="${!!v.query||!v.collapsed?.includes(folder)}"`)}<div ${!v.query&&v.collapsed?.includes(folder)?'hidden':''}>${items.filter(x=>x.folder===folder).sort((a,b)=>a.name.localeCompare(b.name)||a.path.localeCompare(b.path)).map(x=>`<div class="pp-source" data-source="${x.id}"><label class="pp-check"><input type="checkbox" data-change="source" value="${x.id}" ${p.sources.includes(x.id)?'checked':''}><span><span class="pp-source-name">${x.name}</span><small>${x.path}</small></span></label><span class="pp-chip">${x.type}</span></div>`).join('')}</div></section>`).join('')||'<p class="pp-muted">No sources match this filter.</p>';}
function setup(s,p){const v=view(s),d=config(s);let panel='';if(v.section==='folders')panel=`<section class="pp-section"><div><h2>Folders</h2><p class="pp-muted">Available to chats running on Studio Mac.</p></div>${d.folders.map((f,i)=>`<div class="pp-row"><div><strong>${esc(f)}</strong><small>${i===0?'Starting folder':'Additional folder'} · mapped on Studio Mac</small></div>${i===0?'<span class="pp-chip">Working folder</span>':btn('removefolder','Remove','',`data-name="${esc(f)}"`)}</div>`).join('')}${btn('addfolder',icon('folder-plus')+' Add folder','pp-outline')}<small>Folder access and selected prompt sources are configured separately.</small></section>`;
if(v.section==='sources')panel=sourceList(s);
if(v.section==='defaults')panel=`<section class="pp-section"><h2>Chat defaults</h2><div class="pp-fields"><label class="pp-label">Provider / model<select data-change="provider">${['Project default','Choose when starting a chat'].map(x=>`<option ${d.provider===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="pp-label">Primary agent<select data-change="agent">${['Default assistant','Research assistant','Writing assistant'].map(x=>`<option ${d.agent===x?'selected':''}>${x}</option>`).join('')}</select></label></div><small>Available models come from the chosen execution host.</small><h3>Allowed features</h3>${['Browser','Read files','Edit files','Run commands'].map(x=>`<label class="pp-check"><input type="checkbox" data-change="tool" value="${x}" ${d.tools.includes(x)?'checked':''}>${x}</label>`).join('')}<div class="pp-row"><div><strong>Project configuration</strong><small>Agents can apply changes you request to this project.</small></div><span class="pp-chip">Available</span></div><small>Source selection and tool availability retain existing authorization rules.</small></section>`;
if(v.section==='devices')panel=`<section class="pp-section"><h2>Devices & sync</h2><p class="pp-muted">Project layout and configuration follow your account.</p>${[['Studio Mac',design.offline?'Offline · cached history available':'Execution host · folders and integrations ready'],['Web','Project synced · executes on Studio Mac'],['Phone','Project synced · uses its own website logins'],['Second desktop','Project synced · folders need mapping before local execution']].map(([a,b])=>`<div class="pp-row"><div><strong>${a}</strong><small>${b}</small></div>${icon(a==='Second desktop'?'folder-input':'monitor')}</div>`).join('')}<div class="pp-group"><div class="pp-row"><div><strong>Shared</strong><small>Chats, browser URLs, tab order and project setup</small></div></div><div class="pp-row"><div><strong>On each device</strong><small>Website logins, local paths, active tab and message drafts</small></div></div></div><small>Sync status in this preview is illustrative.</small></section>`;
return `<div class="pp-full"><div class="pp-chat-heading"><div><div class="pp-eyebrow">${esc(p.name)} · setup</div><h1>Define once. Inherit in every chat.</h1></div>${btn('back','Back to project','pp-outline')}</div><div class="pp-settings-nav">${[['folders','Folders'],['sources','Sources'],['defaults','Chat defaults'],['devices','Devices & sync']].map(([id,t])=>btn('section',t,'',`data-id="${id}" aria-pressed="${v.section===id}"`)).join('')}</div>${panel}<div class="pp-actions" style="margin-top:auto;padding-top:20px">${btn('savesetup','Save project setup','pp-primary')}${btn('back','Cancel')}<small>Applies to ${esc(p.name)} only</small></div></div>`;
}
function modal(s,p){const m=transient[s].modal;if(!m)return '';let title='',body='',action='',label='';if(m==='newchat'){title='New chat in '+p.name;body=`<label class="pp-label">Chat title<input name="title" placeholder="What are we working on?" required></label><label class="pp-label">First message<textarea name="message" rows="4" placeholder="Start with a question or task…"></textarea></label><div class="pp-group"><div class="pp-row"><div><strong>Project setup v${p.revision}</strong><small>${esc(p.folders.join(', '))} · ${p.sources.length} selected sources<br>${esc(p.agent)} · Studio Mac</small></div>${icon('check')}</div></div><small>${design.offline?'The execution host is offline. You can save a chat and draft.':'Sources are inherited. You can get straight to the conversation.'}</small>`;action='createchat';label=design.offline?'Create chat & save draft':'Create chat';}
if(m==='newproject'){title='New project';body=`<label class="pp-label">Project name<input name="name" placeholder="e.g. Field guide" required></label><label class="pp-label">Start with a workspace<select name="preset"><option>Research workspace</option><option>Writing workspace</option><option>Start empty</option></select></label><small>The project gets its own setup. Editing it will not change the original workspace.</small>`;action='createproject';label='Create project';}
if(m==='transfer'){const t=p.tabs.find(t=>t.id===view(s).active);title='Send '+(t?.name||'browser tab');body=`<label class="pp-label">Action<select name="operation"><option value="copy">Send a copy</option><option value="move">Move tab</option></select></label><label class="pp-label">Destination<select name="destination"><option value="main">Main navigation</option>${model.projects.filter(x=>x.id!==p.id).map(x=>`<option value="${x.id}">Project · ${esc(x.name)}</option>`).join('')}</select></label><small>Copies open independently. A move removes the original after the destination accepts it. Website logins stay with each device.</small>`;action='transfer';label='Send tab';}
if(m==='folder'){title='Add a folder to '+p.name;body=`<label class="pp-label">Folder<select name="folder"><option>Reference library</option><option>Drafts</option><option>Assets</option></select></label><small>Preview folder choices · the desktop app would use its native folder picker.</small>`;action='addfolder';label='Add folder';}
if(m==='tabs'){title='Tabs in '+p.name;body=`<div class="pp-list">${p.tabs.map(t=>btn('tab',icon(t.type==='chat'?'message-square':'globe')+esc(t.name),'pp-outline',`data-id="${t.id}"`)).join('')}</div>${btn('newtab','+ New browser tab','pp-primary')}`;}
if(m==='chats'){title='Chats in '+p.name;body=`<div class="pp-list">${p.chats.map(c=>btn('chat',icon('message-square')+esc(c.name),'pp-outline',`data-id="${c.id}"`)).join('')}</div>${btn('newchat','+ New chat','pp-primary')}`;}
if(m==='presets'){title='Workspaces';body='<p>Reusable folder and context presets for standalone chats and new projects.</p><div class="pp-row"><div><strong>Research workspace</strong><small>Guide + Research · 5 selected sources</small></div></div><div class="pp-row"><div><strong>Writing workspace</strong><small>Guide · 2 selected sources</small></div></div><small>Existing workspaces remain available. A project owns its copied setup and ongoing work.</small>';}
return `<div class="pp-overlay"><section class="pp-dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="pp-chat-heading"><h2>${esc(title)}</h2>${btn('dismiss',icon('x'),'','aria-label="Close dialog"')}</div><form data-form="${action||'none'}" class="pp-section">${body}${action?`<div class="pp-dialog-actions">${btn('dismiss','Cancel')}<button class="cursor-interaction pp-primary" type="button" data-submit>${label}</button></div>`:''}</form></section></div>`;}
function mainBrowser(s){const t=model.mainTabs.find(t=>t.id===view(s).mainId);return `<div class="pp-full"><div><div class="pp-eyebrow">Main navigation</div><h1>${esc(t?.name||'Browser')}</h1></div><div class="pp-page"><small>${esc(t?.url||'')}</small><h2>Reference collection</h2><p>This browser tab is outside any project.</p>${btn('mainlink','Open companion guide in a new tab ↗','pp-link')}</div></div>`;}
function standalone(){return `<div class="pp-full"><div><div class="pp-eyebrow">Standalone chat</div><h1>General chat</h1></div><div class="pp-message"><p>Standalone chats continue to use a workspace and their own context selection.</p></div><div class="pp-group"><div class="pp-row"><div><strong>Research workspace</strong><small>Reusable folder and context preset · no project membership</small></div></div></div></div>`;}
function render(){root.querySelectorAll('.pp-app').forEach(el=>{const s=el.dataset.surface,v=view(s),p=project(s);el.classList.toggle('pp-dense',design.dense);let content=v.screen==='mainbrowser'?mainBrowser(s):v.screen==='standalone'?standalone():v.screen==='index'?index(s):v.screen==='setup'?setup(s,p):header(s,p)+tabs(s,p)+`<div class="pp-body">${rail(s,p)}${p.tabs.find(t=>t.id===v.active)?.type==='browser'?browser(s,p,p.tabs.find(t=>t.id===v.active)):chat(s,p,p.tabs.find(t=>t.id===v.active))}</div>`;el.innerHTML=top(s,p)+`<div class="pp-frame">${sidebar(s,p)}<main class="pp-work">${content}</main></div><footer class="pp-status"><span>Design preview · ${s==='phone'?'Phone':'Desktop'}</span><output aria-live="polite">${esc(notices[s]||'Project changes stay within this preview.')}</output></footer>`+modal(s,p);});if(globalThis.lucide)lucide.createIcons({attrs:{width:15,height:15}});}
function commit(){render();save();}
root.addEventListener('click',e=>{const submit=e.target.closest('[data-submit]');if(submit){const form=submit.closest('form');if(form.reportValidity())form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));return;}const b=e.target.closest('[data-action]');if(!b)return;const el=b.closest('.pp-app'),s=el.dataset.surface,v=view(s),p=project(s),a=b.dataset.action;
if(a==='project')openProject(s,b.dataset.id);
if(a==='maintab'){v.mainId=b.dataset.id;v.screen='mainbrowser';}
if(a==='mainlink'){const t={id:'tab-'+model.next++,type:'browser',name:'Companion guide',url:'https://example.com/companion'};model.mainTabs.push(t);v.mainId=t.id;}
if(a==='hideproject'){v.openProjects=(v.openProjects||['field','site']).filter(id=>id!==p.id);}
if(a==='index'||a==='home'||a==='hideproject'){v.screen='index';note(s,a==='hideproject'?`${p.name} closed. Its chats and tabs are retained.`:'');}
if(a==='allchats'){v.screen='index';note(s,'Project chats also appear in All Chats with their project label.');}
if(a==='standalone'){v.screen='standalone';note(s,'General chats keep their independent workspace selection.');}
if(['newchat','newproject','transfer','chats','tabs','presets'].includes(a))transient[s].modal=a;
if(a==='dismiss')delete transient[s].modal;
if(a==='tab'){v.active=b.dataset.id;v.screen='project';delete transient[s].modal;}
if(a==='chat'){v.active=b.dataset.id;v.screen='project';delete transient[s].modal;const c=p.chats.find(c=>c.id===v.active);if(!p.tabs.some(t=>t.id===c.id))p.tabs.push({id:c.id,type:'chat',name:c.name});}
if(a==='newtab'){delete transient[s].modal;addBrowser(s,'','New tab');}
if(a==='link')addBrowser(s);
if(a==='reference'){const t=p.tabs.find(t=>t.url==='https://example.com/guide');if(t){v.active=t.id;v.screen='project';}else addBrowser(s,'https://example.com/guide','Reference guide');}
if(a==='closetab'){const i=p.tabs.findIndex(t=>t.id===b.dataset.id);if(i>=0){const [t]=p.tabs.splice(i,1);if(t.type==='browser'){p.closed??=[];p.closed.push(t);}if(v.active===t.id)v.active=p.tabs[Math.min(i,p.tabs.length-1)]?.id||'';note(s,t.type==='chat'?'Tab closed. The chat remains in this project.':'Browser tab closed.');}}
if(a==='reopen'){const t=p.closed?.pop();if(t){p.tabs.push(t);v.active=t.id;}}
if(a==='setup'){delete transient[s].modal;transient[s].setup=JSON.parse(JSON.stringify(p));v.screen='setup';v.query='';v.type='All';}
if(a==='section')v.section=b.dataset.id;
if(a==='type')v.type=b.dataset.type;
if(a==='collapse'){v.collapsed??=[];v.collapsed=v.collapsed.includes(b.dataset.folder)?v.collapsed.filter(x=>x!==b.dataset.folder):[...v.collapsed,b.dataset.folder];}
if(a==='back'){delete transient[s].setup;v.screen='project';}
if(a==='addfolder')transient[s].modal='folder';
if(a==='removefolder')config(s).folders=config(s).folders.filter(x=>x!==b.dataset.name);
if(a==='savesetup'){const d=config(s);['folders','sources','provider','agent','tools'].forEach(k=>p[k]=structuredClone(d[k]));p.revision++;delete transient[s].setup;v.screen='project';note(s,`Saved setup v${p.revision}. Project chats inherit it on their next turn.`);}
if(a==='addfromchat'){const c=p.chats.find(c=>c.id===v.active);p.folders.push('Reference library');p.revision++;c.messages.push({kind:'user',text:'Add the reference folder to this project.'},{kind:'receipt',revision:p.revision});note(s,'Project updated. The original workspace is unchanged.');}
if(a==='undofolder'){p.folders=p.folders.filter(f=>f!=='Reference library');p.revision++;note(s,'Folder addition undone with a new project revision.');}
if(a==='send'){const c=p.chats.find(c=>c.id===v.active),text=v.drafts[c?.id]?.trim();if(c&&text&&!design.offline){c.messages.push({kind:'user',text},{kind:'assistant',text:`I'll work within ${p.name} using project setup v${p.revision}. This is a simulated reply.`});v.drafts[c.id]='';note(s,'Preview message added. No provider was called.');}}
commit();if(transient[s].modal)el.querySelector('.pp-dialog input,.pp-dialog select,.pp-dialog button')?.focus();});
root.addEventListener('input',e=>{const s=e.target.closest('.pp-app')?.dataset.surface;if(!s)return;const v=view(s);if(e.target.dataset.input==='draft'){v.drafts[e.target.dataset.chat]=e.target.value;save();}if(e.target.dataset.input==='sources'){const pos=e.target.selectionStart;v.query=e.target.value;v.type='All';render();const input=root.querySelector(`[data-surface="${s}"] [data-input="sources"]`);input.focus();input.setSelectionRange(pos,pos);save();}});
root.addEventListener('change',e=>{const s=e.target.closest('.pp-app')?.dataset.surface;if(!s)return;const d=config(s),kind=e.target.dataset.change;if(kind==='source'||kind==='tool'){const key=kind==='source'?'sources':'tools';d[key]=e.target.checked?[...new Set([...d[key],e.target.value])]:d[key].filter(x=>x!==e.target.value);}if(kind==='agent'){d.agent=e.target.value;const id=d.agent==='Research assistant'?'research':d.agent==='Writing assistant'?'writer':null;if(id&&!d.sources.includes(id))d.sources.push(id);}if(kind==='provider')d.provider=e.target.value;if(kind)render();});
root.addEventListener('submit',e=>{const form=e.target.closest('[data-form]');if(!form)return;e.preventDefault();const s=form.closest('.pp-app').dataset.surface,v=view(s),p=project(s),data=new FormData(form),a=form.dataset.form;
if(a==='createchat'){const id='chat-'+model.next++,name=String(data.get('title')).trim()||'New chat',message=String(data.get('message')||'').trim();p.chats.unshift({id,name,subtitle:'Just now',messages:message&&!design.offline?[{kind:'user',text:message},{kind:'assistant',text:`Ready with ${p.name}'s setup. This conversation stays in the project.`}]:[]});p.tabs.push({id,type:'chat',name});v.active=id;v.screen='project';if(design.offline)v.drafts[id]=message;note(s,'Chat created with inherited project setup.');}
if(a==='createproject'){const id='project-'+model.next++,name=String(data.get('name')).trim()||'New project',preset=data.get('preset'),empty=preset==='Start empty';model.projects.push({id,name,description:empty?'Ready for your project setup.':`Started from ${preset}.`,revision:1,folders:empty?[]:preset==='Writing workspace'?['Guide']:['Guide','Research'],sources:empty?[]:preset==='Writing workspace'?['brief','style']:['brief','style','research','writer','browser'],provider:'Project default',agent:empty?'Default assistant':'Research assistant',tools:['Browser','Read files'],chats:[],tabs:[]});openProject(s,id);note(s,'Project created with its own setup.');}
if(a==='addfolder'){const d=config(s),f=String(data.get('folder'));if(!d.folders.includes(f))d.folders.push(f);note(s,'Folder selected. Save setup to apply it to the project.');}
if(a==='transfer'){const t=p.tabs.find(x=>x.id===v.active),destination=String(data.get('destination')),move=data.get('operation')==='move';if(t){const target=destination==='main'?model.mainTabs:model.projects.find(x=>x.id===destination).tabs;target.push({...t,id:move?t.id:'copy-'+model.next++});if(move){p.tabs=p.tabs.filter(x=>x.id!==t.id);v.active=p.tabs[0]?.id||'';}note(s,`${move?'Moved':'Copied'} to ${destination==='main'?'main navigation':model.projects.find(x=>x.id===destination).name}.`);}}
if(a==='address'){const t=p.tabs.find(t=>t.id===v.active),url=String(data.get('url')||'').trim();if(url){t.url=/^https?:\/\//i.test(url)?url:/\s/.test(url)?'https://example.com/search?q='+encodeURIComponent(url):'https://'+url;t.name=/\s/.test(url)?'Search: '+url:url.replace(/^https?:\/\//,'').split('/')[0];note(s,'Preview navigation stays in this project.');}}
delete transient[s].modal;commit();});
root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input')&&e.target.closest('form')){e.preventDefault();const form=e.target.closest('form');if(form.reportValidity())form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));}if(e.key==='Escape'){const s=e.target.closest('.pp-app')?.dataset.surface;if(s&&transient[s].modal){delete transient[s].modal;render();}}});
window.addEventListener('openai:set_globals',e=>{const m=e.detail?.globals?.widgetState?.privateContent?.projectsDemo;if(m?.version===1&&m.views&&Array.isArray(m.projects)){model=m;render();}});
render();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addToggle(design,'offline',{label:'Execution host offline'});tweak.addToggle(design,'dense',{label:'Compact setup rows'});}
})();
