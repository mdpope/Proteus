<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proteus · Unified Home review</title><link rel="stylesheet" href="../../../public/proteus-theme.css"><link rel="stylesheet" href="../../../public/home.css"><link rel="stylesheet" href="../../../public/markdown/style.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--proteus-bg);color:var(--proteus-ink);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.demo-controls{padding:12px 20px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--proteus-line)}button,select{font:inherit;background:var(--proteus-control);color:var(--proteus-ink);border:1px solid var(--proteus-line);padding:8px 12px;border-radius:6px}.demo-controls span{margin-left:auto;color:var(--proteus-muted);font-size:13px}.app-shell{display:grid;grid-template-columns:215px minmax(0,1fr);min-height:calc(100vh - 58px)}.app-rail{padding:22px 16px;display:flex;flex-direction:column;gap:8px;background:var(--proteus-sidebar);border-right:1px solid var(--proteus-line)}.app-brand{font-size:20px;margin:0 8px 20px}.app-rail nav{display:grid;gap:6px}.app-rail nav div{padding:11px;border-radius:8px;color:var(--proteus-muted)}.app-rail nav div:first-child{color:var(--proteus-accent);background:var(--proteus-control)}.app-footer{margin-top:auto;padding-top:80px;color:var(--proteus-muted);font-size:12px}.allowance{display:flex;gap:8px;margin:12px 0}.allowance span{flex:1;text-align:center}.allowance b{display:block;margin-top:7px;padding:6px;background:var(--proteus-control);border-radius:20px;font-weight:400}.app-main{padding:30px 34px}.app-shell.mobile{max-width:430px;margin:auto;grid-template-columns:1fr}.app-shell.mobile .app-rail{display:none}.app-shell.mobile .app-main{padding:24px 18px}.app-shell.mobile .home-destinations{grid-template-columns:1fr}@media(max-width:700px){.app-shell{grid-template-columns:1fr}.app-rail{display:none}.app-main{padding:24px 18px}.demo-controls{flex-wrap:wrap}}
</style></head><body><div class="demo-controls"><label for="surface">Preview</label><select id="surface"><option value="desktop">Desktop</option><option value="web">Web</option><option value="mobile">Mobile web</option></select><span>Design demo · sample content, no live connection</span></div><div class="app-shell"><aside class="app-rail"><strong class="app-brand">⤨ Proteus</strong><nav><div>⌂　 Home</div><div>◷　 Schedules</div><div>♧　 Chats</div><div>!　 Needs attention</div><div>≋　 Transcription</div><div>♡　 Life</div><div>☷　 Team Tools</div><div>▦　 Workspaces</div><div>⚙　 Engine Room</div></nav><footer class="app-footer"><div>AI ALLOWANCE</div><div class="allowance"><span>Copilot<b>—</b></span><span>Codex<b>—</b></span><span>Claude<b>—</b></span></div><p id="demo-status">Local runner · demo</p><p id="demo-version">Desktop · v0.2.3</p></footer></aside><main class="app-main" id="demo-home"></main></div><script src="../../../public/markdown/runtime.js"></script><script type="module">
import {mountHome} from '../../../public/shared/ui/home.js';
const readme=await fetch('../../../README.md').then(response=>response.text());
const changelog=`## 0.2.3 — October 6, 2026

- Find Mac connections and choose a Default Mac in Engine Room.
- Keep browser pages and documents beside their conversations.
- Review tool activity and failed-tool messages inside the chat.
- Continue work across authorized Macs and mobile devices.
- Restore saved tab descriptors after restarting.

## 0.2.1 — October 5, 2026

- Added compact browser controls and tab ordering.
- Improved chat navigation and reading position.
`;
function render(){const surface=document.querySelector('#surface').value;document.querySelector('.app-shell').classList.toggle('mobile',surface==='mobile');document.querySelector('#demo-status').textContent=surface==='desktop'?'Local runner · demo':'Default Mac · demo';document.querySelector('#demo-version').textContent=(surface==='desktop'?'Desktop':'Website')+' · v0.2.3';mountHome(document.querySelector('#demo-home'),{version:'0.2.3',buildRevision:'Full signed build revision · demo',readme,changelog,update:{message:'Automatic updates are not configured for this build.'}},{desktop:surface==='desktop',markdown:(target,source)=>ProteusMarkdown.mount(target,source),navigate:page=>{document.querySelector('#demo-status').textContent='Demo destination: '+page;}})}document.querySelector('#surface').onchange=render;render();
</script></body></html>
