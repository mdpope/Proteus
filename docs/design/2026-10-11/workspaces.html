function openWorkspace(id,child){state.workspace=id;state.page='workspace';if(!state.top.includes(id))state.top.push(id);state.recent=[id,...state.recent.filter(x=>x!==id)];if(child)state.last[id]=child;state.last[id]??='workspace';modal=null;}
function openChat(id,placement){const c=state.chats.find(c=>c.id===id),target=placement||(state.page==='workspace'?'workspace':'main');state.workspace=c.ws;if(target==='main'){state.page='mainchat';state.mainChat=id;const key='main:'+id;if(!state.top.includes(key))state.top.push(key);}else{openWorkspace(c.ws,id);if(!ws().tabs.some(t=>t.id===id))ws().tabs.push({id,type:'chat',name:c.title});}modal=null;}
function openConfig(id){openWorkspace(id,'workspace');state.panels[id]='config';state.configId=id;configDraft=state.configDrafts[id]??=structuredClone(ws(id).config);}
function filters(){const key=state.page==='workspace'?ws().id:'all';state.filter[key]??={query:'',workspace:'',provider:'',status:'',type:'all',archived:false};return state.filter[key];}
function header(){return `<div class="topbar"><span class="brand">${ic('sprout')} Proteus</span>${button('menu',ic('menu')+' Proteus','mobile')}${state.top.map(id=>{const w=state.workspaces.find(w=>w.id===id),chat=state.chats.find(c=>'main:'+c.id===id),browser=state.mainBrowsers.find(t=>t.id===id),title=w?.name||chat?.title||browser?.name||'Tab',selected=state.page==='workspace'?id===state.workspace:state.page==='mainchat'?id==='main:'+state.mainChat:state.page==='mainbrowser'&&id===state.mainBrowser;return `<div class="top-tab ${selected?'active':''}">${button('top',ic(w?'folder':chat?'message-square':'globe')+`<span class="tab-name">${esc(title)}</span>`,'',`data-id="${id}" data-tooltip="${esc(title)}"`)}${button('closetop','×','close',`data-id="${id}" aria-label="Close ${esc(title)} tab"`)}</div>`;}).join('')}${button('globalplus',ic('plus'),'','aria-label="Add main navigation tab"')}</div>`;}
function sidebar(){const inWorkspace=state.page==='workspace'||state.page==='list';return `<aside class="global">${[['home','house','Home'],['schedules','clock','Schedules'],['all','messages-square','Chats'],['internet','search','Internet Searches'],['attention','circle-alert','Needs attention'],['transcription','audio-lines','Transcription'],['life','heart','Life'],['team','list','Team Tools'],['list','panels-top-left','Workspaces']].map(([a,i,n])=>button(a,ic(i)+n,'',`aria-pressed="${a==='list'?inWorkspace:state.page===a}"`)+(a==='list'&&inWorkspace?`<div class="navchildren">${state.recent.slice(0,7).map(id=>button('open',`<span class="tab-name">${esc(ws(id).name)}</span><small>${esc(ws(id).host)}</small>`,'recent',`data-id="${id}" data-tooltip="${esc(ws(id).name)} · ${esc(ws(id).host)}"`)).join('')}</div>`:'')).join('')}${button('engine',ic('settings')+' Engine Room')}<div class="bottom">${ic('monitor')} Studio Mac · Connected<br>Design preview · sample data</div></aside>`;}
function workspaceList(){let list=state.workspaces.filter(w=>(w.name+' '+w.host).toLowerCase().includes(state.listQuery.toLowerCase()));list.sort(state.listSort==='name'?(a,b)=>a.name.localeCompare(b.name):(a,b)=>state.recent.indexOf(a.id)-state.recent.indexOf(b.id));return `<div class="page"><div class="heading"><div><h1>Workspaces</h1><p>Your workspaces across connected machines.</p></div><div class="actions">${button('import','Import VS Code','outline')}${button('newworkspace','＋ Workspace','primary')}</div></div><div class="fields"><label>Filter workspaces<input data-input="listQuery" placeholder="Filter by name or machine" value="${esc(state.listQuery)}"></label><label>Sort<select data-change="listSort">${option('recent','Recent',state.listSort)}${option('name','Name · A–Z',state.listSort)}</select></label></div><div class="list">${list.map(w=>`<div class="workspace-row"><div>${button('open',ic('folder')+esc(w.name),'workspace-title',`data-id="${w.id}"`)}<p>${esc(w.host)}${state.defaultWorkspaces[w.host]===w.id?' · default':''} · ${state.chats.filter(c=>c.ws===w.id).length} chats</p></div><div class="actions">${button('config','Configure','outline',`data-id="${w.id}"`)}${button('open','Open →','outline',`data-id="${w.id}"`)}</div></div>`).join('')}</div></div>`;}
function visibleTabs(w){const shown=w.tabs.slice(0,3),current=w.tabs.find(t=>t.id===state.last[w.id]);if(current&&!shown.includes(current))shown.splice(2,1,current);return shown;}
function workspaceChrome(){const w=ws(),id=state.last[w.id];return `<div class="childbar" aria-label="Workspace tabs"><div class="child pinned ${id==='workspace'?'active':''}">${button('child',ic('pin')+' Workspace','',`data-id="workspace"`)}</div>${visibleTabs(w).map(t=>`<div class="child ${id===t.id?'active':''}">${button('child',ic(kinds[t.type])+`<span class="tab-name">${esc(t.name)}</span>`,'',`data-id="${t.id}" data-tooltip="${esc(t.name)}"`)}${button('closechild','×','close',`data-id="${t.id}" aria-label="Close ${esc(t.name)}"`)}</div>`).join('')}${w.tabs.length>3?button('tabs',`${w.tabs.length-3} more`):''}${button('addtab',ic('plus'),'','aria-label="Add workspace tab"')}</div><div class="mobile mobile-tabs">${button('child','Workspace','outline','data-id="workspace"')}${button('tabs','Tabs','outline')}${button('addtab',ic('plus'),'','aria-label="Add workspace tab"')}</div>`;}
function chatList(locked){const f=filters(),workspace=locked?ws():null;const rows=state.chats.filter(c=>(!workspace||c.ws===workspace.id)&&(!f.workspace||locked||c.ws===f.workspace)&&(!f.query||(c.title+' '+ws(c.ws).name).toLowerCase().includes(f.query.toLowerCase()))&&(!f.provider||c.provider===f.provider)&&(!f.status||c.status===f.status)&&(f.type==='all'||c.type===f.type)&&(f.archived||!c.archived)).sort((a,b)=>b.rank-a.rank);return `<div class="page"><div class="heading"><div><div class="eyebrow">${locked?'Workspace chat list':'All connected Macs'}</div><h1>${locked?'Chats':'Chats'}</h1><p>${locked?'All conversations in '+esc(workspace.name)+'.':'Every chat, across your workspaces.'}</p></div>${!locked?button('newchat',ic('plus')+' New chat','primary'):button('refresh',ic('refresh-cw')+' Refresh','outline')}</div><div class="actions">${[['all','All'],['user','Chats'],['internet','Internet searches'],['scheduled','Scheduled']].map(([id,name])=>button('chattype',name,'',`data-id="${id}" aria-pressed="${f.type===id}"`)).join('')}</div><div class="filters"><label>Search<input data-input="chatQuery" placeholder="Search chat titles" value="${esc(f.query)}"></label><label>Workspace${locked?`<span class="locked" data-locked-workspace="${workspace.id}">${ic('lock-keyhole')} ${esc(workspace.name)}</span>`:`<select data-filter="workspace">${option('','All workspaces',f.workspace)}${state.workspaces.map(w=>option(w.id,w.name,f.workspace)).join('')}</select>`}</label><label>Provider<select data-filter="provider">${option('','All providers',f.provider)}${['Claude','Codex','Copilot'].map(p=>option(p,p,f.provider)).join('')}</select></label><label>Status<select data-filter="status">${option('','All statuses',f.status)}${['Completed','Needs input'].map(p=>option(p,p,f.status)).join('')}</select></label></div><div class="heading"><small>${rows.length} ${rows.length===1?'chat':'chats'}${locked?' · workspace filter locked':''}</small><label class="check"><input type="checkbox" data-filter="archived" ${f.archived?'checked':''}>Show archived</label></div><div class="list" data-chat-list>${rows.map(c=>button('chat',`<span><strong>${esc(c.title)}</strong><small>${locked?esc(ws(c.ws).host):esc(ws(c.ws).name)+' · '+esc(ws(c.ws).host)} · ${c.provider}${c.archived?' · Archived':''}</small></span><span class="meta">${esc(c.status)}</span><span class="meta updated">${esc(c.time)}</span>`,'chat-row',`data-id="${c.id}"`)).join('')||'<div class="empty">No chats match these filters.</div>'}</div>${locked?'<small>Closing a chat tab keeps the conversation in this list.</small>':'<small>Open a chat in the main navigation. Right-click a chat to send its tab to its workspace.</small>'}</div>`;}
function chatView(t){const w=ws(),c=state.chats.find(c=>c.id===t.id),selected=Object.entries(w.config.modes).filter(([,m])=>m!=='disabled').length;return `<div class="page"><div class="heading"><div><h2>${esc(c.title)}</h2><p>${c.provider} · ${esc(w.name)} · ${esc(c.status.toLowerCase())}</p></div><div class="actions">${button('details',ic('panel-right'),'outline','aria-label="Toggle chat details"')}${button('tabmenu',ic('ellipsis'),'outline','aria-label="Chat actions"')}</div></div><div class="chat-layout" style="${details?'':'grid-template-columns:1fr'}"><div class="conversation">${c.id==='outline'?`<div class="message user">Build an outline from the research we’ve collected.</div><div class="message assistant"><div class="eyebrow">Assistant</div><p>I’m using <strong>${esc(w.name)}</strong>’s instructions, source selections and approvals.</p><p>A practical structure for the guide:</p><ul><li>Start with the reader’s goal.</li><li>Show the method through worked examples.</li><li>End each chapter with a short checklist.</li></ul>${button('reference','Open the reference library ↗','textlink')}</div>`:!c.messages.length?`<div class="message assistant"><div class="eyebrow">Workspace context</div><p>This conversation uses ${esc(w.name)}’s complete configuration. Its browser pages and other tabs stay in this workspace.</p></div>`:''}${c.messages.map(m=>`<div class="message ${m.role}">${esc(m.text)}</div>`).join('')}<div class="composer"><textarea data-input="draft" aria-label="Message" placeholder="Message in ${esc(w.name)}…">${esc(state.drafts[c.id]||'')}</textarea><div class="composer-foot"><small>${esc(c.provider)} · Workspace defaults${design.offline?' · owner offline':''}</small>${button('send',ic('arrow-up'),'primary',`aria-label="Send message" ${design.offline?'disabled':''}`)}</div></div></div>${details?`<aside class="details-box"><h3>Workspace context</h3><div class="row"><div><strong>${esc(w.name)}</strong><small>Configuration v${w.version}</small></div></div><div class="row"><div><strong>${selected} selected sources</strong><small>Instructions, skills, agents & MCPs</small></div></div><div class="row"><div><strong>${esc(w.config.approval)}</strong><small>Inherited workspace approvals</small></div></div><div class="row"><div><strong>${esc(w.config.starting||'Not set')}</strong><small>Command starting folder</small></div></div>${button('config','Configure workspace','outline',`data-id="${w.id}"`)}</aside>`:''}</div></div>`;}
function browserView(t){return `<div class="page"><div class="browserbar"><input aria-label="Browser address" data-input="address" value="${esc(t.url||'')}" placeholder="Search or enter address">${button('navigate','Go','outline')}${button('transfer',ic('arrow-right-left')+' Send tab','outline')}</div><div class="webpage"><div class="eyebrow">Example reference site</div><h2>${esc(t.name)}</h2><p>Research notes, practical examples and reliable references for your next draft.</p>${button('newlink','Open writing examples in a new tab ↗','textlink')}<div class="row"><div><h3>From research to a useful guide</h3><small>Organize your sources around the reader’s questions.</small></div>${ic('book-open')}</div></div><small>Owned by ${esc(ws().name)} · new links remain in this workspace</small></div>`;}
function terminalView(t){return `<div class="page"><div class="heading"><div><h2>${esc(t.name)}</h2><p>Studio Mac · workspace folder: ${esc(ws().config.starting||'not set')}</p></div>${button('tabmenu',ic('ellipsis'),'outline','aria-label="Terminal actions"')}</div><div class="terminal"><strong>Studio Mac / ${esc(ws().config.starting||'workspace')}</strong>\n\n$ pwd\n${esc(ws().config.starting||'workspace')}\n\n$ ▌</div><div class="note">Terminal preview. A live terminal stays on its execution host; opening it on another device connects to that host.</div></div>`;}
function documentView(t){return `<div class="page"><div class="heading"><h2>${esc(t.name)}</h2>${button('tabmenu',ic('ellipsis'),'outline','aria-label="Document actions"')}</div><article class="webpage"><div class="eyebrow">Workspace document</div><h2>Research brief</h2><p>Make the guide useful to someone encountering this topic for the first time.</p><h3>Working principles</h3><p>Start with a clear question. Prefer primary references. Keep examples short and concrete.</p></article></div>`;}
function sourceGroups(){const c=cfg(),q=state.sourceQuery.toLowerCase(),hits=sourceData.filter(s=>[...c.folders,...c.library].includes(s.folder)&&[s.name,s.folder,s.path,s.kind].some(t=>t.toLowerCase().includes(q))),items=hits.filter(s=>(state.sourceKind==='All'||s.kind===state.sourceKind)&&(!state.favoritesOnly||c.favorites.includes(s.id)));return `<div class="section"><div class="heading"><div class="actions">${['All','Instructions','Skills','Agents','MCPs'].map(k=>button('sourcekind',k+' '+hits.filter(s=>k==='All'||s.kind===k).length,state.sourceKind===k?'primary':'outline',`data-id="${k}"`)).join('')}</div><input data-input="sourceQuery" aria-label="Filter context" placeholder="Filter by name or path" value="${esc(state.sourceQuery)}"></div><p class="muted">Every chat is automatic within ${esc(ws().name)}. With workspace follows its source folder. Choose per chat appears in the chat picker. Disabled excludes automatic loading. Skills supply their instructions; agents are registered for use when needed. MCPs start disabled.</p><label class="check"><input type="checkbox" data-favorites-only ${state.favoritesOnly?'checked':''}>Favorites only</label><div class="source-results">${[...new Set(items.map(s=>s.folder))].sort().map(folder=>`<section class="group"><div class="group-head">${button('collapse',ic('folder')+folder,'',`data-folder="${folder}"`)}<div class="actions">${button('refreshfolder','↻ Refresh','outline',`data-folder="${folder}"`)}${button('starting',c.starting===folder?'✓ Command folder':'Set as starting folder','outline',`data-folder="${folder}" ${c.starting===folder?'disabled':''}`)}</div></div><div ${!q&&state.collapsed.includes(folder)?'hidden':''}><div class="source-columns muted"><span>Source</span><span>Scope / status</span><span>Load in</span><span></span></div>${items.filter(s=>s.folder===folder).sort((a,b)=>a.name.localeCompare(b.name)).map(s=>`<div class="source-columns source-row" data-source="${s.id}"><div><strong>${s.name}</strong><small>${s.path}</small>${s.id==='browse'?'<small>2 source aliases</small>':''}</div><div><span class="pill">${s.kind}</span><small>${s.folder}</small><small>${s.kind==='MCPs'?'stdio · connection not checked':'Discovered · see chat details for delivery'}</small></div><select data-source-mode="${s.id}" aria-label="Load ${s.name}">${Object.entries({universal:'Every chat',workspace:'With workspace',available:'Choose per chat',disabled:'Disabled'}).map(([k,n])=>option(k,n,c.modes[s.id]||'disabled')).join('')}</select><div class="actions">${button('favorite',c.favorites.includes(s.id)?'★':'☆','',`data-id="${s.id}" aria-label="Favorite ${s.name}" aria-pressed="${c.favorites.includes(s.id)}"`)}${button('opensource','Open ↗','outline',`data-id="${s.id}"`)}</div></div>`).join('')}</div></section>`).join('')||'<div class="empty">No matching sources.</div>'}</div></div>`;}
function configuration(){const c=cfg(),w=ws();const folderRow=(f,library=false)=>`<div class="row"><div><strong>${esc(f)}</strong><small>${esc(w.host)} · ${esc(state.scans[w.id+f]||'Last scan complete')}</small></div><div class="actions">${library?`<label class="check"><input type="checkbox" data-universal="${esc(f)}" ${c.universal.includes(f)?'checked':''}>Every chat</label>`:c.starting===f?'<span class="pill">Command folder</span>':''}${button('refreshfolder','↻ Refresh','outline',`data-folder="${esc(f)}"`)}${button('removefolder','×','',`data-folder="${esc(f)}" data-library="${library}" aria-label="Remove ${esc(f)}" ${!library&&c.starting===f?'disabled':''}`)}</div></div>`;return `<div class="page configuration"><div class="heading"><div><h2>Workspaces & context.</h2><p>Configuration for ${esc(w.name)} · ${esc(w.host)}</p></div><div class="actions">${button('import','Import VS Code','outline')}${button('refreshall','↻ Refresh','primary')}</div></div><details class="config-section" data-config-section="folders" ${state.sections.folders?'open':''}><summary>Workspace folders</summary><div class="section"><label>Command starting folder<select data-config="starting">${c.folders.map(f=>option(f,f,c.starting)).join('')}</select></label><div class="actions">${button('default',state.defaultWorkspaces[w.host]===w.id?'Default workspace':'Use as default','outline')}${button('addfolder','＋ Add folder','outline')}</div>${c.folders.map(f=>folderRow(f)).join('')||'<p>No folders configured.</p>'}</div></details><details class="config-section" data-config-section="library" ${state.sections.library?'open':''}><summary>Sources across workspaces</summary><div class="section"><p class="muted">Add another source folder or an individual document. Repositories stay where they are. This workspace’s selections and Every chat settings apply only to ${esc(w.name)}.</p><div class="actions">${button('addsource','＋ Source folder','outline')}${button('adddocument','＋ Document','outline')}</div>${c.library.map(f=>folderRow(f,true)).join('')}${c.documents.map(d=>`<div class="row"><div><strong>${esc(d.name)}</strong><small>${esc(d.kind)} · individual document</small></div>${button('opendocument','Open ↗','outline',`data-name="${esc(d.name)}"`)}</div>`).join('')}<p class="muted">Refresh rescans instructions, skills, agents, and MCP definitions without restarting. New chats use current selections. Existing chats can refresh their context between turns; their previous conversation remains.</p><small>Last refreshed: ${esc(state.scans[w.id]||'Today · 4:30 PM')}</small><div><strong>Editable context configuration</strong><p class="muted">App data / workspaces / ${esc(w.id)} / context.json</p><div class="actions">${button('copypath','Copy path','outline')}${button('openfile','Open ↗','outline')}</div></div></div></details><details class="config-section" data-config-section="sources" ${state.sections.sources?'open':''}><summary>Instructions, skills, agents & MCPs</summary>${sourceGroups()}</details><details class="config-section" data-config-section="defaults" ${state.sections.defaults?'open':''}><summary>Chat defaults</summary><div class="fields"><label>Source loading<select data-config="loading">${option('defaults','Include every-chat and workspace defaults',c.loading)}${option('selected','Only selected sources',c.loading)}</select></label><label>Main agent (optional)<select data-config="agent">${['Default assistant',...sourceData.filter(s=>s.kind==='Agents'&&c.modes[s.id]&&c.modes[s.id]!=='disabled').map(s=>s.name)].map(n=>option(n,n,c.agent)).join('')}</select></label><label>Provider<select data-config="provider">${['Workspace default','Claude','Codex','Copilot'].map(n=>option(n,n,c.provider)).join('')}</select></label></div><p class="muted">Browser, file reading/editing, commands and terminals are always available, subject to approvals. Models and effort use the owner’s current provider catalog.</p></details><details class="config-section" data-config-section="approvals" ${state.sections.approvals?'open':''}><summary>Workspace tool approvals</summary><div class="section"><label>Default approval mode<select data-config="approval">${['Ask each time','Saved rules only','Trusted folders','Auto-approve tools'].map(n=>option(n,n,c.approval)).join('')}</select></label><h3>Authorized folders and saved rules</h3>${c.folders.map(f=>`<div class="row"><div><strong>${esc(f)}</strong><small>Folder and descendants · ${esc(w.host)}</small></div><select data-grant="${esc(f)}" aria-label="${esc(f)} folder approval">${[['ask','Ask'],['read','Read only'],['read-write','Read and write']].map(([k,n])=>option(k,n,c.folderTrust[f]||'ask')).join('')}</select></div>`).join('')}<p class="muted">Inherited by this workspace’s chats. Chat-only overrides stay separate. Commands follow tool approvals; folder grants do not confine terminal commands.</p></div></details><details class="config-section" data-config-section="discovery" ${state.sections.discovery?'open':''}><summary>Discovery & exclusions</summary><div class="section"><label>Exclude folder names or relative paths · one per line<textarea data-config="exclusions" rows="4">${esc(c.exclusions.join('\n'))}</textarea></label><label>Always include these relative paths<textarea data-config="exceptions" rows="2">${esc(c.exceptions.join('\n'))}</textarea></label><p class="muted">Each folder has an independent scan budget. Refresh one folder without rescanning the others. Exclusions affect discovery, not folder access.</p><strong>Discovery issues</strong><small>No discovery issues in this sample.</small></div></details><details class="config-section" data-config-section="devices" ${state.sections.devices?'open':''}><summary>Machine & synchronization</summary><div class="section"><div class="row"><div><strong>${esc(w.host)}</strong><small>Owning machine · all workspace chats run here</small></div><span class="pill">${design.offline?'Offline':'Connected'}</span></div><p class="muted">Available from other desktops, web and mobile. Viewing from another device does not change the owner. Another machine needs its own workspace and configuration copy.</p>${button('copyworkspace','Copy configuration to another machine','outline')}<small>Browser sessions, credentials and live terminals remain on their owning machine.</small></div></details><div class="savebar">${button('saveconfig','Save workspace configuration','primary')}${button('discard','Discard changes')}<small>Applies only to ${esc(w.name)}</small></div></div>`;}
function dialog(){if(!modal)return '';let title='',body='',action='',submit='';if(modal==='newworkspace'){title='Create workspace';body=`<label>Name<input name="name" required placeholder="e.g. Field guide"></label><label>Owning machine<select name="host"><option>Studio Mac</option><option>Travel Mac</option></select></label><label>Starting configuration<select name="copy">${option('','Start empty','')}${state.workspaces.map(w=>option(w.id,'Copy configuration from '+w.name+' · '+w.host,state.copyFrom||'')).join('')}</select></label><small>Copying reuses folders and source selections. Chats, tabs, credentials and saved approvals are not copied.</small>`;action='createworkspace';submit='Create workspace';}
if(modal==='newchat'){title='New chat';const selected=state.page==='workspace'?ws().id:filters().workspace||state.workspace;body=`<label>Workspace<select name="workspace" ${state.page==='workspace'?'disabled':''}>${state.workspaces.map(w=>option(w.id,w.name,selected)).join('')}</select></label><label>Chat name<input name="name" placeholder="A name can be chosen automatically"></label><label>Message<textarea name="message" rows="4" required placeholder="What would you like to work on?"></textarea></label><div class="note" data-inherited>${esc(ws(selected).name)} supplies folders, instructions, skills, agents, MCPs and approvals.</div>`;action='createchat';submit=design.offline?'Create chat & save draft':'Start chat';}
if(modal==='addtab'){title='Add to '+ws().name;body=`<div class="dialog-list">${[['newchat','message-square','New chat'],['newbrowser','globe','Browser tab'],['newterminal','terminal','Terminal'],['newdocument','file-text','Document']].map(([a,i,t])=>button(a,ic(i)+t,'outline')).join('')}</div><small>New content stays inside this workspace.</small>`;}
if(modal==='tabs'){title='Tabs in '+ws().name;body=`<div class="dialog-list">${button('child',ic('pin')+' Workspace · pinned','outline','data-id="workspace"')}${ws().tabs.map(t=>button('child',ic(kinds[t.type])+esc(t.name),'outline',`data-id="${t.id}"`)).join('')}</div>`;}
if(modal==='menu'){title='Proteus';body=`<div class="dialog-list">${button('list',ic('folders')+' All workspaces','outline')}${button('all',ic('messages-square')+' All chats','outline')}${state.recent.slice(0,design.recentCount).map(id=>button('open',ic('folder')+esc(ws(id).name),'outline',`data-id="${id}"`)).join('')}${button('config',ic('settings-2')+' Workspace configuration','outline')}</div>`;}
if(modal==='addfolder'||modal==='addsource'){title='Add workspace folder';body=`<label>Folder<select name="folder">${['Guide','Research','Website','Reference library'].map(f=>option(f,f,'')).join('')}</select></label><small>Sample picker. The desktop app would select a real folder on the execution host.</small>`;action=modal;submit=modal==='addsource'?'Add source folder':'Add folder';}
if(modal==='transfer'){title='Send browser tab';body=`<label>Action<select name="operation"><option value="copy">Send a copy</option><option value="move">Move tab</option></select></label><label>Destination<select name="destination"><option value="main">Main navigation</option>${state.workspaces.filter(w=>w.id!==ws().id).map(w=>option(w.id,w.name,'')).join('')}</select></label><small>A copy opens independently. A move transfers ownership after the destination accepts it.</small>`;action='transfer';submit='Send tab';}
if(modal==='tabmenu'){const t=active();title='Tab actions';body=`<label>Tab name<input name="name" value="${esc(t?.name)}" required></label>${t?.type==='chat'?button('archivechat','Archive this chat','outline'):''}<small>Long tab names use an ellipsis. The full name remains available on hover or focus.</small>`;action='rename';submit='Save name';}
if(modal==='pendingconfig'){title='Unsaved workspace changes';body=`<p>Keep the changes to ${esc(ws(state.configId).name)} before configuring ${esc(ws(pendingConfig).name)}?</p><div class="actions">${button('saveswitch','Save and switch','primary')}${button('discardswitch','Discard and switch','outline')}${button('dismiss','Cancel')}</div>`;}
if(modal==='chatmenu'){const c=state.chats.find(c=>c.id===state.menuChat);title=c.title;body=`<div class="dialog-list">${button('sendchat','Send tab to '+esc(ws(c.ws).name),'primary')}${button('showworkspacechat','Also open in workspace','outline')}</div><small>Same conversation. An existing workspace tab will be focused, not duplicated.</small>`;}
if(modal==='globalplus'){title='New tab';body=`<div class="dialog-list">${button('globalnewchat','New chat','outline')}${button('newworkspace','New workspace','outline')}</div>`;}
if(modal==='file'){title='Source preview';body=`<p>${esc(state.fileLabel)}</p><small>Sample path only. Production keeps the existing Open and Copy path behavior on the owning machine.</small>`;}
if(modal==='import'){title='Import VS Code';body='<p>Choose a .code-workspace file on the owning machine.</p><small>Native file picker preview. Existing folder import behavior is retained.</small>';}
if(modal==='adddocument'){title='Add context document';body='<label>Document<input name="name" value="Reference notes.md" required></label><label>Use as<select name="kind"><option>Instructions / reference</option><option>Skill</option><option>Agent</option></select></label>';action='adddocument';submit='Add';}
return `<div class="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="heading"><h2>${esc(title)}</h2>${button('dismiss',ic('x'),'','aria-label="Close dialog"')}</div><form data-form="${action}">${body}${action?`<div class="actions end">${button('dismiss','Cancel')}<button type="button" data-submit class="primary cursor-interaction">${submit}</button></div>`:''}</form></section></div>`;}
function render(){app.classList.toggle('dense',design.density==='Compact');let content;if(state.page==='list')content=workspaceList();else if(state.page==='all')content=chatList(false);else if(state.page==='mainchat')content=`<div class="standalone-strip">${button('noop',ic('pin')+' Chat','primary')}${button('chatmenu','Send to workspace…','outline',`data-id="${state.mainChat}"`)}</div>`+chatView({id:state.mainChat});else if(state.page==='mainbrowser')content=`<div class="page"><h1>${esc(state.mainBrowsers.find(t=>t.id===state.mainBrowser)?.name)}</h1><p>Main navigation browser tab</p></div>`;else if(state.page==='workspace')content=workspaceChrome()+(state.last[ws().id]==='workspace'||!active()?workspaceHome():active().type==='chat'?chatView(active()):active().type==='browser'?browserView(active()):active().type==='terminal'?terminalView(active()):documentView(active()));else content=`<div class="page"><h1>${esc(state.feature||'Home')}</h1><p class="muted">Feature page · no navigation tab is created.</p>${button('list','Workspaces','outline')}</div>`;app.innerHTML=header()+`<div class="frame">${sidebar()}<main>${content}</main></div><footer class="footer"><span>Design preview · sample data</span><output aria-live="polite">${esc(notice)}</output></footer>`+dialog();if(globalThis.lucide)lucide.createIcons({attrs:{width:15,height:15}});}
function changed(){render();persist();}
function addContent(type){const w=ws(),id='tab-'+state.next++;w.tabs.push({id,type,name:type==='browser'?'New tab':type==='terminal'?'Terminal · '+(w.config.starting||'workspace'):'Research brief',...(type==='browser'?{url:''}:{})});state.last[w.id]=id;modal=null;}
function workspaceHome(){const w=ws(),config=state.panels[w.id]==='config';return `<div class="workspace-home-head"><div class="heading"><div><h1>${esc(w.name)}</h1><p class="muted">${esc(w.host)} · ${design.offline?'Owner offline':'Connected'} · ${state.chats.filter(c=>c.ws===w.id).length} chats</p></div>${button('newchat','＋ New chat','primary')}</div><div class="actions page-switch">${button('panel','Chats',config?'outline':'primary','data-id="chats"')}${button('panel','Configuration',config?'primary':'outline','data-id="config"')}</div></div>${config?configuration():chatList(true)}`;}

root.addEventListener('toggle',e=>{if(e.target.isConnected&&e.target.dataset.configSection)state.sections[e.target.dataset.configSection]=e.target.open;},true);
root.addEventListener('contextmenu',e=>{const el=e.target.closest('[data-action="chat"],[data-action="top"]');if(!el)return;let id=el.dataset.id;if(id?.startsWith('main:'))id=id.slice(5);if(!state.chats.some(c=>c.id===id))return;e.preventDefault();state.menuChat=id;modal='chatmenu';render();});
root.addEventListener('click',e=>{const submit=e.target.closest('[data-submit]');if(submit){const f=submit.closest('form');if(f.reportValidity())f.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));return;}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;notice='';
if(a==='list'||a==='all'){state.page=a;modal=null;}
if(['home','schedules','internet','attention','transcription','life','team','engine'].includes(a)){state.page=a;state.feature=b.textContent;modal=null;}
if(a==='open')openWorkspace(id);
if(a==='top'){if(id.startsWith('main:'))openChat(id.slice(5),'main');else if(state.workspaces.some(w=>w.id===id))openWorkspace(id);else{state.mainBrowser=id;state.page='mainbrowser';}}
if(a==='closetop'){state.top=state.top.filter(t=>t!==id);state.page='list';notice='Closed the tab; saved content is retained.';}
if(a==='config')openConfig(id||state.workspace);
if(a==='panel'){state.panels[ws().id]=id;if(id==='config')openConfig(ws().id);}
if(a==='child'){state.last[ws().id]=id;modal=null;}
if(a==='closechild'){ws().tabs=ws().tabs.filter(t=>t.id!==id);if(state.last[ws().id]===id)state.last[ws().id]='workspace';}
if(a==='chat')openChat(id);
if(a==='chatmenu'){state.menuChat=id||state.mainChat||active()?.id;modal='chatmenu';}
if(a==='sendchat'){const id=state.menuChat;state.top=state.top.filter(t=>t!=='main:'+id);openChat(id,'workspace');notice='Moved tab into its workspace. The conversation is unchanged.';}
if(a==='showworkspacechat'){openChat(state.menuChat,'workspace');notice='Opened the same chat in its workspace.';}
if(a==='chattype')filters().type=id;
if(a==='refresh')notice='Sample chat list refreshed.';
if(['newworkspace','newchat','addtab','tabs','menu','addfolder','addsource','adddocument','transfer','tabmenu'].includes(a))modal=a;
if(a==='copyworkspace'){modal='newworkspace';state.copyFrom=ws().id;}
if(a==='globalplus')modal='globalplus';
if(a==='globalnewchat'){state.page='all';modal='newchat';}
if(a==='dismiss')modal=null;
if(a==='newbrowser')addContent('browser');if(a==='newterminal')addContent('terminal');if(a==='newdocument')addContent('document');
if(a==='reference'){if(state.page==='mainchat'){const t={id:'browser-'+state.next++,type:'browser',name:'Reference library',url:'https://example.com/reference'};state.mainBrowsers.push(t);state.top.push(t.id);state.mainBrowser=t.id;state.page='mainbrowser';}else{const t=ws().tabs.find(t=>t.id==='reference');if(t)state.last[ws().id]=t.id;else{addContent('browser');Object.assign(active(),{name:'Reference library',url:'https://example.com/reference'});}}}
if(a==='newlink'){addContent('browser');Object.assign(active(),{name:'Writing examples',url:'https://example.com/examples'});}
if(a==='navigate'){const value=root.querySelector('[data-input=address]').value;active().url=value;active().name=value||'New tab';}
if(a==='details')details=!details;
if(a==='send'){const c=state.chats.find(c=>c.id===(state.page==='mainchat'?state.mainChat:active()?.id));if(c&&state.drafts[c.id]?.trim()&&!design.offline){c.messages.push({role:'user',text:state.drafts[c.id]},{role:'assistant',text:'Preview reply using this workspace’s configuration.'});state.drafts[c.id]='';}}
if(a==='sourcekind')state.sourceKind=id;
if(a==='collapse'){const f=b.dataset.folder;state.collapsed=state.collapsed.includes(f)?state.collapsed.filter(x=>x!==f):[...state.collapsed,f];}
if(a==='starting'){cfg().starting=b.dataset.folder;if(!cfg().folders.includes(b.dataset.folder))cfg().folders.push(b.dataset.folder);}
if(a==='favorite'){const c=cfg();c.favorites=c.favorites.includes(id)?c.favorites.filter(x=>x!==id):[...c.favorites,id];}
if(a==='refreshfolder'){state.scans[ws().id+b.dataset.folder]='Refreshed just now';notice='Refreshed '+b.dataset.folder+' only. Other folders were not rescanned (preview).';}
if(a==='refreshall'){state.scans[ws().id]='Just now';[...cfg().folders,...cfg().library].forEach(f=>state.scans[ws().id+f]='Refreshed just now');notice='Workspace source refresh completed (preview).';}
if(a==='removefolder'){const c=cfg(),f=b.dataset.folder,key=b.dataset.library==='true'?'library':'folders';c[key]=c[key].filter(x=>x!==f);}
if(a==='default'){state.defaultWorkspaces[ws().host]=ws().id;notice='Default workspace set for '+ws().host+' (preview).';}
if(a==='saveconfig'){ws().config=structuredClone(cfg());ws().version++;notice='Saved configuration for '+ws().name+' only.';}
if(a==='discard'){configDraft=state.configDrafts[ws().id]=structuredClone(ws().config);}
if(a==='import'){modal='import';}
if(['opensource','openfile','opendocument','copypath'].includes(a)){state.fileLabel=a==='opensource'?sourceData.find(s=>s.id===id).path:a==='opendocument'?b.dataset.name:'App data / workspaces / '+ws().id+' / context.json';modal='file';}
if(a==='archivechat'){const id=state.page==='mainchat'?state.mainChat:active()?.id;state.chats.find(c=>c.id===id).archived=true;ws().tabs=ws().tabs.filter(t=>t.id!==id);state.top=state.top.filter(t=>t!=='main:'+id);openWorkspace(ws().id,'workspace');}
changed();if(modal)root.querySelector('.dialog input,.dialog select,.dialog button')?.focus();});
root.addEventListener('input',e=>{const t=e.target,k=t.dataset.input;if(k==='draft'){state.drafts[state.page==='mainchat'?state.mainChat:active().id]=t.value;persist();return;}if(['listQuery','chatQuery','sourceQuery'].includes(k)){const pos=t.selectionStart;if(k==='chatQuery')filters().query=t.value;else state[k]=t.value;if(k==='sourceQuery')state.sourceKind='All';render();const el=root.querySelector(`[data-input=${k}]`);el.focus();el.setSelectionRange(pos,pos);persist();}if(t.dataset.config){const k=t.dataset.config;cfg()[k]=['exclusions','exceptions'].includes(k)?t.value.split('\n').filter(Boolean):t.value;}});
root.addEventListener('change',e=>{const t=e.target;if(t.closest('form')){if(t.name==='workspace'){const note=root.querySelector('[data-inherited]');if(note)note.textContent=ws(t.value).name+' supplies folders, instructions, skills, agents, MCPs and approvals. Owner: '+ws(t.value).host;}return;}if(t.dataset.input)return;if(t.dataset.filter)filters()[t.dataset.filter]=t.type==='checkbox'?t.checked:t.value;if(t.dataset.change==='listSort')state.listSort=t.value;if(t.dataset.sourceMode){cfg().modes[t.dataset.sourceMode]=t.value;if(t.value==='disabled'&&cfg().agent===sourceData.find(s=>s.id===t.dataset.sourceMode).name)cfg().agent='Default assistant';}if(t.dataset.config)cfg()[t.dataset.config]=['exclusions','exceptions'].includes(t.dataset.config)?t.value.split('\n').filter(Boolean):t.value;if(t.dataset.grant)cfg().folderTrust[t.dataset.grant]=t.value;if(t.hasAttribute('data-favorites-only'))state.favoritesOnly=t.checked;if(t.dataset.universal){const f=t.dataset.universal;cfg().universal=t.checked?[...new Set([...cfg().universal,f])]:cfg().universal.filter(x=>x!==f);}changed();});
root.addEventListener('submit',e=>{const form=e.target.closest('[data-form]');if(!form)return;e.preventDefault();const d=new FormData(form),a=form.dataset.form;
if(a==='createworkspace'){const id='ws-'+state.next++,copy=d.get('copy'),config=copy?structuredClone(ws(copy).config):makeConfig([],{},'Default assistant','Ask each time'),host=String(d.get('host')||'Studio Mac');config.approval='Ask each time';config.folderTrust={};config.host=host;state.workspaces.push({id,name:String(d.get('name')).trim(),host,description:'',config,version:1,tabs:[]});state.recent.unshift(id);state.last[id]='workspace';openConfig(id);}
if(a==='createchat'){const w=ws(String(d.get('workspace')||state.workspace)),id='chat-'+state.next++,text=String(d.get('message')).trim(),placement=state.page==='workspace'?'workspace':'main';state.chats.push({id,ws:w.id,title:String(d.get('name')).trim()||text.slice(0,65),provider:w.config.provider==='Workspace default'?'Codex':w.config.provider,type:'user',status:design.offline?'Draft':'Completed',time:'Just now',rank:state.next,messages:design.offline?[]:[{role:'user',text},{role:'assistant',text:'Preview reply. Configuration inherited from '+w.name+' on '+w.host+'.'}]});if(design.offline)state.drafts[id]=text;openChat(id,placement);}
if(a==='addfolder'||a==='addsource'){const f=String(d.get('folder')),c=cfg(),key=a==='addsource'?'library':'folders';if(!c[key].includes(f))c[key].push(f);if(!c.starting&&a==='addfolder')c.starting=f;}
if(a==='adddocument'){cfg().documents.push({name:String(d.get('name')),kind:String(d.get('kind'))});}
if(a==='rename'){const id=state.page==='mainchat'?state.mainChat:active()?.id,name=String(d.get('name'));const chat=state.chats.find(c=>c.id===id);if(chat)chat.title=name;for(const w of state.workspaces)for(const t of w.tabs)if(t.id===id)t.name=name;}
if(a==='transfer'){const w=ws(),t=active(),dest=String(d.get('destination')),move=d.get('operation')==='move',copy={...t,id:move?t.id:'copy-'+state.next++};if(dest==='main'){state.mainBrowsers.push(copy);state.top.push(copy.id);}else ws(dest).tabs.push(copy);if(move){w.tabs=w.tabs.filter(x=>x.id!==t.id);state.last[w.id]='workspace';}notice=(move?'Moved':'Copied')+' browser tab.';}
modal=null;changed();});
root.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=null;render();}if(e.key==='Enter'&&e.target.matches('input')&&e.target.closest('form')){e.preventDefault();const f=e.target.closest('form');if(f.reportValidity())f.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));}});
window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent?.workspacePreview;if(s?.version===3&&s.workspaces?.length){state=s;configDraft=state.configDrafts[state.workspace]||null;render();}});
render();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(design,'density',{label:'List density',options:['Comfortable','Compact']});tweak.addToggle(design,'offline',{label:'Owning machine offline'});}
})();
</script>
