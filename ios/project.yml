name: Proteus
options:
  bundleIdPrefix: org.proteusapp
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '0.2.19'
    CURRENT_PROJECT_VERSION: '2610.14.2'
targets:
  ProteusMobile:
    type: application
    productName: Proteus
    platform: iOS
    sources:
      - Proteus
      - path: ../README.md
        buildPhase: resources
      - path: ../public/markdown
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.proteusapp.proteus.mobile
        INFOPLIST_FILE: Proteus/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: Proteus
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ProteusTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ProteusTests]
    dependencies:
      - target: ProteusMobile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Proteus.app/Proteus"
        BUNDLE_LOADER: "$(TEST_HOST)"
  ProteusUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ProteusUITests]
    dependencies:
      - target: ProteusMobile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Proteus:
    build:
      targets:
        ProteusMobile: all
    test:
      targets:
        - ProteusTests
        - ProteusUITests
